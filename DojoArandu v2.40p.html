/* ============================================================
   RELATÓRIOS GERENCIAIS (controle da academia)
   ============================================================ */
function rdHash(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }

/* retenção: aluno com presença entrou antes do mês e ainda está ativo */
function rdCohort(m) {
  const ativos = activeStudents();
  const base = ativos.filter(s => (s.joinDate || '2000-01').slice(0, 7) <= m);
  const novos = db.students.filter(s => (s.joinDate || '').startsWith(m));
  /* saída: aluno inativo cujo último registro (aula ou mensalidade) cai no mês */
  const lastSeen = s => {
    const aulas = studentDates(s.id).slice(-1)[0] || '';
    const pays = db.payments.filter(p => p.studentId === s.id).map(p => p.month).sort().slice(-1)[0] || '';
    return (aulas.slice(0, 7) > pays ? aulas.slice(0, 7) : pays);
  };
  const inativos = db.students.filter(s => s.status !== 'Ativo');
  const churn = inativos.filter(s => lastSeen(s) === m);
  const churnEstimado = inativos.filter(s => !lastSeen(s));
  return {
    base: base.length,
    novos: novos.length,
    churn: churn.length,
    taxa: base.length ? Math.round((churn.length / base.length) * 1000) / 10 : 0,
    retencao: base.length ? Math.round(((base.length - churn.length) / base.length) * 1000) / 10 : 100,
    churnEstimado: churnEstimado.length
  };
}

/* inadimplência (mês + carteira acumulada) */
function rdDelinquency(m) {
  const pays = paymentsOf(m);
  const pagos = pays.filter(p => p.status === 'Pago');
  const atrasados = pays.filter(isLatePayment);
  const aberto = pays.filter(p => p.status !== 'Pago');
  const valorAberto = sum(aberto, p => p.amount);
  const valorAtraso = sum(atrasados, p => p.amount);
  const faturado = sum(pays, p => p.amount) || 1;
  return {
    n: pays.length, pagos: pagos.length, atrasados: atrasados.length, abertos: aberto.length,
    valorAberto, valorAtraso,
    pctAtraso: Math.round((valorAtraso / faturado) * 1000) / 10,
    ticket: Math.round(sum(pagos, p => p.amount) / Math.max(1, pagos.length))
  };
}

/* frequência do mês por grupo, com média e alunos em risco de evasão */
function rdFrequency(m) {
  const days = new Set(Object.keys(db.attendance).filter(d => d.startsWith(m)));
  const media = lastMonths(6, m).map(mm => {
    const ds = Object.keys(db.attendance).filter(d => d.startsWith(mm));
    const total = ds.reduce((a, d) => a + attendanceOf(d).length, 0);
    return { m: mm, total, calls: ds.length, avg: ds.length ? Math.round(total / ds.length) : 0 };
  });
  const porGrupo = Object.keys(GROUPS).map(g => {
    const total = [...days].reduce((a, d) => a + attendanceOf(d).filter(id => groupOf(studentById(id) || {}) === g).length, 0);
    const head = rosterOf(g).length;
    return { g, total, head, perAluno: head ? Math.round((total / head) * 10) / 10 : 0 };
  });
  /* dias previstos de treino no mês = soma dos dias de cada turma no calendário real */
  const [yy, mm2] = m.split('-').map(Number);
  const diasComTreino = (() => {
    const dim = m === MONTH ? TODAY.getDate() : new Date(yy, mm2, 0).getDate();
    let n = 0;
    for (let d = 1; d <= dim; d++) {
      const wd = new Date(yy, mm2 - 1, d).getDay();
      if (Object.keys(GROUPS).some(g => GROUPS[g].days.includes(wd)) || wd === 6) n++;
    }
    return n;
  })();
  const ocupacao = Math.round((days.size / Math.max(1, diasComTreino)) * 100);
  /* quem treinou pouco/muito no mês */
  const risco = activeStudents().map(s => {
    const n = studentDates(s.id).filter(d => d.startsWith(m)).length;
    const ult = studentDates(s.id).slice(-1)[0] || '';
    return { s, n, ult };
  }).sort((a, b) => a.n - b.n);
  return { dias: days.size, media, porGrupo, ocupacao, risco };
}

/* faixas: distribuição e próximo grau */
function rdBelts() {
  const ativos = activeStudents();
  const dist = BELTS.map(([name, color]) => ({ name, color, n: ativos.filter(s => s.belt === name).length }))
    .filter(b => b.n > 0).sort((a, b) => b.n - a.n);
  const graus = ativos.map(s => ({ s, graus: degreeOf(s) }));
  const aptos = graus.filter(x => x.graus >= 4);
  const semGrau = graus.filter(x => x.graus === 0).length;
  return { dist, total: ativos.length, aptos, semGrau, mediaGraus: ativos.length ? Math.round((sum(graus, x => x.graus) / ativos.length) * 10) / 10 : 0 };
}

/* visão de caixa: 6 meses, tendência e projeção */
function rdCash(m) {
  const months = lastMonths(6, m);
  const rows = months.map(mm => {
    const rev = sum(paymentsOf(mm).filter(p => p.status === 'Pago'), p => p.amount);
    const exp = sum(expensesOf(mm), e => e.amount);
    return { m: mm, rev, exp, net: rev - exp };
  });
  const rec = rows.map(r => r.rev).filter(v => v > 0);
  const média = rec.length ? rec.reduce((a, b) => a + b, 0) / rec.length : 0;
  const ultimo = rows[rows.length - 1] || { rev: 0, exp: 0, net: 0 };
  const mesAtual = rows.find(r => r.m === m) || ultimo;
  const variacao = rec.length >= 2 ? Math.round(((rec[rec.length - 1] - rec[rec.length - 2]) / Math.max(1, rec[rec.length - 2])) * 1000) / 10 : 0;
  const fixas = sum(expensesOf(m).filter(e => ['Salário', 'Aluguel', 'Energia'].includes(e.category)), e => e.amount);
  const fixasMeses = rows.map(r => sum(expensesOf(r.m).filter(e => ['Salário', 'Aluguel', 'Energia'].includes(e.category)), e => e.amount));
  const fixaMédia = fixasMeses.filter(v => v > 0).length ? Math.round(fixasMeses.reduce((a, b) => a + b, 0) / fixasMeses.filter(v => v > 0).length) : 0;
  return { rows, média: Math.round(média), ultimo, mesAtual, variacao, fixas, fixaMédia, projecao: Math.round(mesAtual.rev - fixaMédia) };
}

/* cobrança: quem deve agora, ordenado por valor/dias */
function rdDebts(m) {
  return paymentsOf(m)
    .filter(p => p.status !== 'Pago')
    .map(p => {
      const s = studentById(p.studentId);
      const atraso = isLatePayment(p) ? Math.round((parseD(TODAY_ISO) - parseD(payDeadline(p))) / 86400000) : 0;
      return { p, s, atraso };
    })
    .filter(x => x.s)
    .sort((a, b) => (b.atraso - a.atraso) || (b.p.amount - a.p.amount));
}

/* relacionamento: veteranos (tempo de casa) + destaques de assiduidade */
function rdPeople(m) {
  const ativos = activeStudents();
  const veteranos = ativos
    .filter(s => s.joinDate)
    .map(s => ({ s, meses: Math.max(0, Math.round((parseD(TODAY_ISO) - parseD(s.joinDate)) / 2629800000)) }))
    .sort((a, b) => b.meses - a.meses).slice(0, 4);
  const ranking = ativos.map(s => ({
    s, n: studentDates(s.id).filter(d => d.startsWith(m)).length
  })).sort((a, b) => b.n - a.n).slice(0, 6);
  const mesesMedio = ativos.filter(s => s.joinDate).length
    ? Math.round(ativos.filter(s => s.joinDate).reduce((a, s) => a + Math.max(0, (parseD(TODAY_ISO) - parseD(s.joinDate)) / 2629800000), 0) / ativos.filter(s => s.joinDate).length)
    : 0;
  return { veteranos, ranking, mesesMedio };
}

/* barras horizontais simples (sem SVG) */

  const pct = max ? Math.max(2, Math.round((value / max) * 100)) : 0;

    <span class="rd-bar-track"><i style="width:${pct}%;background:${color}"></i></span>

}

}

/* fix da série semanal (escopo limpo) */
function weekSeries(refDate) {
  const start = weekStart(refDate);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const series = { Adulto: [], Kids: [] };
  days.forEach(day => {
    const wd = parseD(day).getDay();
    ['Adulto', 'Kids'].forEach(g => {
      const roster = rosterOf(g);
      if (!GROUPS[g].days.includes(wd) || !roster.length) { series[g].push(null); return; }
      const n = attendanceOf(day).filter(id => { const s = studentById(id); return s && groupOf(s) === g; }).length;
      series[g].push(view.weekMetric === 'percent' ? Math.round((n / roster.length) * 100) : n);
    });
  });
  return { days, series, adultTotal: rosterOf('Adulto').length, kidsTotal: rosterOf('Kids').length };
}

let posDraft = { q: '', cat: 'Todas', selected: [] };
function allPositions() { return POSITION_DB.concat(db.customPositions || []); }
/* ============================================================
   12. MAPA MENTAL · árvore de posições e sequência do treino
   ============================================================ */
const MAP = { cat: 'Todas', root: null, focus: null, trail: [], seq: [], search: '' };
let mapSearch = '';

const mapNodes = () => POS_DB.map(n => ({ ...n })).concat((db.customPositions || []).map(c => ({
  id: c.id, name: c.name, cat: c.category, tier: 1, desc: 'Posição criada por você.', custom: true
})));
const mapEdges = () => MOVES.concat((db.customMoves || []).map(m => ({ ...m, custom: true })));
const mapOut = id => mapEdges().filter(m => m.from === id);
const mapIn = id => mapEdges().filter(m => m.to === id);
const mapNode = id => mapNodes().find(n => n.id === id) || { id, name: id, cat: '—', desc: '' };
/* id canônico de posição (POSITION_DB/custom) a partir de um nó do mapa */
function cidOf(mapId) {
  const seed = POS_DB.find(x => x.id === mapId);
  if (!seed) return mapId;
  const hit = allPositions().find(p => p.name.toLowerCase() === seed.name.toLowerCase());
  return hit ? hit.id : mapId;
}
/* garante que todo nó do mapa exista como posição treinável */
function mapEnsurePositions() {
  let changed = false;
  POS_DB.forEach(n => {
    if (!allPositions().some(p => p.name.toLowerCase() === n.name.toLowerCase())) {
      db.customPositions.push({ id: 'cpos-' + uid(), category: n.cat, name: n.name });
      changed = true;
    }
  });
  if (changed && typeof save === 'function') save();
}
const inSeq = id => MAP.seq.some(s => s.pos === id);

function seqAdd(nodeId, viaEdge) {
  const pos = cidOf(nodeId);
  if (inSeq(pos)) { toast('Essa posição já está na sequência.'); return; }
  MAP.seq.push({ pos, node: nodeId, via: viaEdge ? { kind: viaEdge.kind, note: viaEdge.note } : null });
  mapRefresh();
  const seqEl = $('.map-seq');
  if (seqEl) { seqEl.classList.add('pulse'); setTimeout(() => seqEl.classList.remove('pulse'), 520); }
}
function seqRemove(i) { MAP.seq.splice(i, 1); mapRefresh(); }
function seqMove(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= MAP.seq.length) return;
  [MAP.seq[i], MAP.seq[j]] = [MAP.seq[j], MAP.seq[i]];
  mapRefresh();
}

/* ---------- mapa: nó em foco + conexões ao redor ---------- */
/* ============================================================
   ÁRVORE TIDY (nós + linhas) — desktop horizontal, celular acordeão
   ============================================================ */
const TREE_DEPTH = 2;        /* foco → galho → subgalho */
const TREE_WELCOME = 4;      /* quantos "nós anteriores" aparecem antes do foco */
const TREE_KIDS = 2;         /* subgalhos por galho */

function treeClamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

/* altura de cada nó (medida aproximada pelo texto, sem medir o DOM) */
function treeNodeH(n, depth) {
  const nameLines = Math.ceil((n.name || '').length / (depth === 2 ? 22 : 26));
  const noteLines = 1;                                  /* o "como acontece" ocupa 1-2 linhas */
  const base = depth === 0 ? 40 : 38;
  return base + nameLines * 15 + noteLines * 12;
}

/* monta a subárvore até TREE_DEPTH sem repetir nós já usados no caminho */
function treeBuild(nodeId, depth, seen, viaEdge) {
  const node = mapNode(nodeId);
  const expanded = depth === 1 ? (MAP.open || []).includes(nodeId) : true;
  const all = mapOut(nodeId).filter(e => !seen.has(e.to));
  const kids = (depth >= TREE_DEPTH || !expanded) ? [] : all.slice(0, TREE_KIDS)
    .map(e => treeBuild(e.to, depth + 1, new Set([...seen, e.to]), e));
  return { id: nodeId, node, via: viaEdge || null, kids, depth, hasMore: all.length, open: expanded };
}

/* layout tidy: sempre da esquerda para a direita
   coluna 0 = nó em foco · coluna 1 = galhos · coluna 2 = subgalhos.
   As "boas-vindas" (nós que chegam ao foco) ocupam o topo da coluna 1. */
function treeLayout(root, measure) {
  const PAD = 24, GAP_Y = 16, COL = 262, ROOT_W = 212, GAP_WELCOME = 8;
  const m = n => (measure ? measure(n) : 0) || Math.max(treeNodeH(n.node, n.depth) + 8, 54);
  const nodes = [];

  /* coluna -1 reservada para "de onde vim" (nós anteriores) */
  const WELCOME_W = 196;
  const ROOT_X = PAD + WELCOME_W + 56;
  root.depth = 0; root.w = ROOT_W; root.h = m(root);
  root.x = ROOT_X; root.y = 0; root.dir = 'right';
  nodes.push(root);

  const welcomes = (root.welcomes || []).map(w => {
    const clone = { id: w.id, node: w.node, via: w.via, kids: [], hasMore: 0, open: true,
      depth: 1, dir: 'right', w: WELCOME_W, visual: 'welcome' };
    clone.h = Math.min(clone.h, 46);
    clone.trail = !!w.trail; clone.stepNo = w.stepNo;
    clone.h = m(clone);
    return clone;
  });

  /* galhos em ordem estável (a mesma das conexões) — nada de pular de faixa */
  const seenTargets = new Set();
  const prevIds = new Set(welcomes.map(w => w.id));
  const branches = (root.kids || []).filter(k => {
    if (seenTargets.has(k.id) || prevIds.has(k.id)) return false;
    seenTargets.add(k.id); return true;
  });

  const col1X = ROOT_X + ROOT_W + 64;
  const col2X = col1X + 224 + 40;
  const colW0 = PAD; /* boas-vindas ficam à esquerda do foco, apontando para ele */
  let y = PAD;

  /* empilha as boas-vindas centradas na altura do foco (calculada no fim) */
  welcomes.forEach((w, i) => { w.x = colW0; });
  if (welcomes.length) y += 10;

  branches.forEach(branch => {
    branch.depth = 1; branch.dir = 'right'; branch.w = 224; branch.h = m(branch);
    const kids = branch.kids || [];
    let ky = y;
    kids.forEach(k => {
      k.depth = 2; k.dir = 'right'; k.w = 190; k.h = m(k);
      k.y = ky + k.h / 2;
      ky += k.h + GAP_Y;
    });
    const kidsH = kids.length ? ky - GAP_Y - y : 0;
    const blockH = Math.max(branch.h, kidsH);
    branch.y = y + blockH / 2;
    if (kids.length) {
      const delta = branch.y - (y + kidsH / 2);
      kids.forEach(k => { k.y += delta; });
    }
    branch.x = col1X;
    kids.forEach(k => { k.x = col2X; });
    nodes.push(branch, ...kids);
    y += blockH + GAP_Y + 10;
  });

  const rest = nodes.filter(n => n.depth > 0);
  if (rest.length) {
    const minY = Math.min(...rest.map(n => n.y - n.h / 2));
    const maxY = Math.max(...rest.map(n => n.y + n.h / 2));
    root.y = (minY + maxY) / 2;
  }
  /* boas-vindas: pilha centrada na altura do foco */
  if (welcomes.length) {
    const totalH = welcomes.reduce((a, w) => a + w.h + GAP_WELCOME, 0) - GAP_WELCOME;
    let wy = Math.max(PAD, root.y - totalH / 2);
    welcomes.forEach(w => { w.y = wy + w.h / 2; wy += w.h + GAP_WELCOME; });
  }
  const H = (rest.length ? Math.max(...rest.map(n => n.y + n.h / 2)) : root.y + root.h / 2) + PAD;
  const W = Math.max(col1X + 224 + 40 + 190, ...nodes.map(n => n.x + n.w)) + PAD;
  if (welcomes.length && root.welcomeExtra) {
    const lastW = welcomes[welcomes.length - 1];
    nodes.push({ id: '__more', node: { name: '+' + root.welcomeExtra + ' anteriores' }, via: null,
      kids: [], depth: -1, visual: 'note', x: lastW.x, y: lastW.y + lastW.h / 2 + 14, h: 16, w: lastW.w });
  }
  /* devolve as boas-vindas já posicionadas (as edges leem daqui) */
  root.welcomes = welcomes;
  nodes.push(...welcomes);
  return { nodes, width: W, height: H };
}

/* segunda passada: usa a altura real dos cartões para não sobrepor nada */
function treeRemeasure() {
  const board = $('#treeBoard');
  const root = MAP._tree;
  if (!board || !root) return;
  const heights = new Map();
  $$('.t-node', board).forEach(el => {
    const card = $('.t-card', el);
    if (card) heights.set(el.dataset.node + ':' + el.dataset.depth + (el.classList.contains('t-node--welcome') ? ':w' : ''), card.offsetHeight);
  });
  const laid = treeLayout(root, n => heights.get(n.id + ':' + n.depth + (n.visual === 'welcome' ? ':w' : '')));
  const svg = $('.tree-svg', board);
  const edges = [];
  (function collect(n) { (n.welcomes || []).forEach(w => edges.push([w, n])); n.kids.forEach(k => { edges.push([n, k]); collect(k); }); })(root);
  laid.nodes.forEach(n => {
    const el = $(n.visual === 'welcome'
      ? `.t-node--welcome[data-node="${n.id}"]`
      : `.t-node[data-node="${n.id}"][data-depth="${n.depth}"]:not(.t-node--welcome)`, board);
    if (el) { el.style.top = (n.y - n.h / 2) + 'px'; el.style.left = n.x + 'px'; el.style.minHeight = Math.max(40, n.h - 10) + 'px'; }
  });
  if (svg) {
    svg.setAttribute('viewBox', `0 0 ${laid.width} ${laid.height}`);
    svg.setAttribute('width', laid.width);
    svg.setAttribute('height', laid.height);
    const paths = $$('.t-edge', svg);
    edges.forEach(([p, c], i) => { if (paths[i]) paths[i].setAttribute('d', treePath(p, c)); });
  }
  board.style.setProperty('--tree-w', laid.width + 'px');
  board.style.setProperty('--tree-h', laid.height + 'px');
  board.style.width = laid.width + 'px';
  board.style.height = laid.height + 'px';
  /* agora sim: posições definitivas → centraliza o foco */
  treeApplyZoom('keep');
  requestAnimationFrame(() => treeCenterFocus());
}

/* curva suave entre pai e filho — sempre da esquerda para a direita */
function treePath(parent, child) {
  const x1 = parent.x + parent.w;
  const y1 = parent.y;
  const x2 = child.x;
  const y2 = child.y;
  const mid = x1 + Math.max(28, (x2 - x1) * 0.55);
  return `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;
}

function mapGraphBody() {
  const focus = mapNode(MAP.focus);
  const outs = mapOut(focus.id);
  const ins = mapIn(focus.id);

  const root = treeBuild(focus.id, 0, new Set([focus.id, cidOf(focus.id)]), null);
  root.kids = outs
    .filter(e => !(MAP.hide || []).includes(e.id))
    .map(e => treeBuild(e.to, 1, new Set([focus.id, e.to]), e));
  /* nós anteriores: conexões que chegam ao foco e não fazem parte do caminho.
     Ficam visíveis sempre — inclusive depois de criar um nó novo. */
  const trailSet = new Set(MAP.trail || []);
  /* a trilha (todos os passos até aqui) entra inteira, em ordem, e depois as
     conexões de entrada que não fazem parte do caminho */
  const trailPrev = (MAP.trail || []).slice(0, -1).map((id, i, arr) => {
    const nxt = (MAP.trail || [])[i + 1];
    const edge = mapEdges().find(m => m.from === id && m.to === nxt);
    return { id, node: mapNode(id), via: edge ? { ...edge } : { kind: 'transition', note: '' },
      kids: [], depth: 1, hasMore: 0, open: true };
  });
  const trailIds = new Set(trailPrev.map(w => w.id));
  const welcomeAll = ins
    .filter(e => e.from !== focus.id && !trailSet.has(e.from) && !trailIds.has(e.from) && mapNodes().some(n => n.id === e.from));
  trailPrev.forEach((w, i) => { w.trail = true; w.stepNo = i + 1; });
  root.welcomes = [...trailPrev, ...welcomeAll.slice(0, TREE_WELCOME)
    .map(e => ({ id: e.from, node: mapNode(e.from), via: { ...e }, kids: [], depth: 1, hasMore: 0, open: true }))];
  root.welcomeExtra = Math.max(0, welcomeAll.length - TREE_WELCOME);
  const laid = treeLayout(root);
  MAP._tree = root;

  const edges = [];
  (function collect(n) {
    (n.welcomes || []).forEach(w => edges.push([w, n]));
    n.kids.forEach(k => { edges.push([n, k]); collect(k); });
  })(root);

  return `
  <div class="map-layout">
  <div class="map-main">
  <div class="map-toolbar map-toolbar--map">
    <button type="button" class="btn btn--sm" id="mapBack">${icon('arrowLeft', 13)} Posições</button>
    ${MAP.trail.length ? `<div class="map-trail">${MAP.trail.map((t, i) => `${i ? '<span class="map-trail-sep">›</span>' : ''}<button type="button" class="map-trail-step" data-trail="${i}">${esc(mapNode(t).name)}</button>`).join('')}</div>` : ''}
    <div class="map-tree-tools">
      <button type="button" class="btn btn--sm btn--ghost" id="treeZoomOut" aria-label="Diminuir">−</button>
      <span class="tree-zoom-val" id="treeZoomVal">100%</span>
      <button type="button" class="btn btn--sm btn--ghost" id="treeZoomIn" aria-label="Aumentar">+</button>
      <button type="button" class="btn btn--sm" id="treeFit">Ajustar</button>
      <span class="tree-pan-hint" title="Arraste o fundo para mover">${icon('hand', 13)} arraste o fundo</span>
    </div>
    <div class="map-legend">
      ${Object.entries(KIND_LABELS).map(([k, l]) => `<span class="map-legend-i" data-kind="${k}"><i></i>${l}</span>`).join('')}
    </div>
  </div>

  <div class="tree-stage">
    <div class="tree-scroll" id="treeScroll">
      <div class="tree-board" id="treeBoard" style="--tree-w:${laid.width}px;--tree-h:${laid.height}px">
        <svg class="tree-svg" viewBox="0 0 ${laid.width} ${laid.height}" width="${laid.width}" height="${laid.height}" aria-hidden="true">
          ${edges.map(([p, c]) => `
            <path d="${treePath(p, c)}" class="t-edge" data-kind="${c.via ? c.via.kind : 'transition'}" data-node="${c.id}" />
          `).join('')}
        </svg>
        ${laid.nodes.filter(n => n.visual === 'note').map(n =>
          `<span class="t-welcome-more" style="left:${n.x}px;top:${n.y}px">${esc(n.node.name)}</span>`).join('')}
        ${laid.nodes.filter(n => n.visual !== 'note').map(n => {
          const kind = n.via ? n.via.kind : null;
          const hasKids = n.kids.length > 0;
          const more = n.depth === 1 ? mapOut(n.id).length - n.kids.length : 0;
          return `<div class="t-node t-node--d${n.depth} ${n.depth === 0 ? 't-node--root' : ''}${n.visual === 'welcome' ? ' t-node--welcome' : ''}"
              style="left:${n.x}px;top:${n.y - n.h / 2}px;width:${n.w}px;min-height:${Math.max(40, n.h - 10)}px"
              data-node="${n.id}" data-depth="${n.depth}" data-kind="${kind || ''}">
            <button type="button" class="t-card" data-focus="${n.id}">
              ${n.visual === 'welcome'
                ? `<span class="t-kind t-kind--welcome">${n.trail ? 'passo ' + (n.stepNo || '') : esc(KIND_LABELS[n.via && n.via.kind] || 'conexão')}</span>`
                : ''}
              ${n.depth === 0
                ? `<span class="t-cat">${esc(n.node.cat)}</span><b>${esc(n.node.name)}</b><span class="t-desc">${esc(n.node.desc || '')}</span>
                   <span class="t-meta">${outs.length} galho${outs.length === 1 ? '' : 's'} · ${ins.length} entrada${ins.length === 1 ? '' : 's'}</span>`
                : `${n.visual === 'welcome' ? '' : `<span class="t-kind" data-kind="${kind}">${esc(KIND_LABELS[kind] || '')}</span>`}<b>${esc(n.node.name)}</b>
                   ${n.via && n.via.note ? `<small>${esc(n.via.note.length > 38 ? n.via.note.slice(0, 36) + '…' : n.via.note)}</small>` : ''}
`}
            </button>
            ${n.depth > 0 && n.visual !== 'welcome' ? `<button type="button" class="t-add" data-seq="${n.id}" data-edge="${n.via ? n.via.id : ''}"
                aria-label="Adicionar ${esc(n.node.name)} à sequência">${inSeq(cidOf(n.id)) ? icon('check', 12) : icon('plus', 12)}</button>` : ''}
            ${n.depth === 1 && n.visual !== 'welcome' && n.hasMore && !n.open ? `<button type="button" class="t-exp" data-expand="${n.id}" aria-label="Expandir ${esc(n.node.name)}">${n.hasMore} ›</button>` : ''}
            ${hasKids ? `<span class="t-dot" data-kind="${kind || 'transition'}"></span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <div class="map-tree-mobile">
    ${mapTreeAccordion(root, focus, outs)}
  </div>

  <div class="map-connect">
    <button type="button" class="btn btn--sm" id="mapAddEdge">${icon('plusCircle', 14)} Nova conexão a partir daqui</button>
    <span class="map-connect-hint">o nó atual é a origem; escolha destino, tipo e a explicação</span>
  </div>
  </div><!-- /map-main -->
  <aside class="map-side">${mapSeqPanel()}</aside>
  </div><!-- /map-layout -->
  `;
}

/* celular: acordeão em árvore (tronco + galhos + subgalhos recolhíveis) */
function mapTreeAccordion(root, focus, outs) {
  const branch = n => {
    const open = (MAP.open || []).includes(n.id) || n.depth === 1;
    return `<li class="acc-item" data-node="${n.id}">
      <div class="acc-row">
        <button type="button" class="acc-card" data-focus="${n.id}">
          <span class="t-kind" data-kind="${n.via ? n.via.kind : 'transition'}">${esc(KIND_LABELS[n.via ? n.via.kind : 'transition'] || '')}</span>
          <b>${esc(n.node.name)}</b>
          ${n.via && n.via.note ? `<small>${esc(n.via.note)}</small>` : ''}
        </button>
        <button type="button" class="t-add" data-seq="${n.id}" data-edge="${n.via ? n.via.id : ''}" aria-label="Adicionar">${inSeq(cidOf(n.id)) ? icon('check', 12) : icon('plus', 12)}</button>
      </div>
      ${n.kids.length ? `<ul class="acc-kids">${n.kids.map(branch).join('')}</ul>` : ''}
    </li>`;
  };
  const prev = root.welcomes || [];
  return `<div class="acc-tree">
    ${prev.length ? `<div class="acc-prev">
      <span class="acc-prev-lab">${icon('arrowLeft', 12)} vem de</span>
      ${prev.map(w => `<button type="button" class="acc-prev-card" data-focus="${w.id}">
        <small>${esc(KIND_LABELS[w.via && w.via.kind] || 'conexão')}</small><b>${esc(w.node.name)}</b></button>`).join('')}
      ${root.welcomeExtra ? `<span class="acc-prev-more">+${root.welcomeExtra} anteriores</span>` : ''}
    </div>` : ''}
    <div class="acc-root">
      <span class="t-cat">${esc(focus.cat)}</span><b>${esc(focus.name)}</b>
      <span class="t-meta">${outs.length} galho${outs.length === 1 ? '' : 's'}</span>
    </div>
    <ul class="acc-list">${root.kids.map(branch).join('') || '<li class="acc-empty">Nó folha — crie uma conexão para crescer.</li>'}</ul>
  </div>`;
}

/* ---------- zoom / ajuste ---------- */
function treeApplyZoom(mode) {
  const board = $('#treeBoard');
  const scroll = $('#treeScroll');
  const val = $('#treeZoomVal');
  if (!board || !scroll) return;
  const w = parseFloat(board.style.getPropertyValue('--tree-w')) || board.offsetWidth;
  const h = parseFloat(board.style.getPropertyValue('--tree-h')) || board.offsetHeight;
  const availH = scroll.clientHeight - 12;
  const availW = scroll.clientWidth - 12;
  let z = MAP.zoom;
  /* o nó em foco (coluna 0) precisa caber sempre: 262px + respiro */
  const needCol0 = 300 / Math.max(1, availW);
  if (mode === 'all' || mode === 'reset-pan') { MAP.pan = { x: 0, y: 0 }; }
  if (mode === 'all') { z = treeClamp(Math.min(availH / h, availW / w, 1), 0.35, 1); MAP.zoom = z; }
  else if (!z) { z = treeClamp(Math.min(availH / h, availW / w, 1, 1 / needCol0), 0.5, 1); MAP.zoom = z; }
  const pan = MAP.pan || { x: 0, y: 0 };
  board.style.transform = `translate(${Math.round(pan.x)}px, ${Math.round(pan.y)}px) scale(${z})`;
  board.style.width = Math.round(w * z) + 'px';
  board.style.height = Math.round(h * z) + 'px';
  /* o SVG usa as coordenadas do quadro; quem escala é o transform do board.
     (escalar aqui também fazia as linhas ficarem longe dos cartões) */
  const svg = $('.tree-svg', board);
  if (svg) { svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('width', Math.round(w)); svg.setAttribute('height', Math.round(h)); }
  if (val) val.textContent = Math.round(z * 100) + '%';
  if (mode !== 'keep') requestAnimationFrame(() => treeCenterFocus(z));
}

/* arrastar o fundo do mapa para posicionar a visualização */
function mapBindPan(host) {
  const sc = $('#treeScroll');
  if (!sc || sc.dataset.pan) return;
  sc.dataset.pan = '1';
  let down = false, sx = 0, sy = 0, sl = 0, st = 0, moved = 0;
  const isBg = el => !el.closest('.t-card, .t-add, .t-exp, button, a, input, select');
  sc.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !isBg(e.target)) return;
    down = true; moved = 0;
    sx = e.clientX; sy = e.clientY; sl = sc.scrollLeft; st = sc.scrollTop;
    sc.classList.add('is-panning');
    try { sc.setPointerCapture(e.pointerId); } catch (err) {}
  });
  const board = $('#treeBoard');
  sc.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved <= 2) return;
    MAP.panFree = true;
    e.preventDefault();
    MAP.pan = MAP.pan || { x: 0, y: 0 };
    MAP.pan.x += e.movementX || 0;
    MAP.pan.y += e.movementY || 0;
    /* segura o quadro dentro de limites razoáveis */
    const lim = 2600;
    MAP.pan.x = Math.max(-lim, Math.min(lim, MAP.pan.x));
    MAP.pan.y = Math.max(-lim, Math.min(lim, MAP.pan.y));
    if (board) {
      const z = parseFloat((board.style.transform.match(/scale\(([\d.]+)\)/) || [])[1]) || 1;
      board.style.transform = `translate(${Math.round(MAP.pan.x)}px, ${Math.round(MAP.pan.y)}px) scale(${z})`;
    }
    sc.scrollLeft = sl - dx; sc.scrollTop = st - dy;
  });
  const end = () => { down = false; sc.classList.remove('is-panning'); };
  sc.addEventListener('pointerup', end);
  sc.addEventListener('pointercancel', end);
  sc.addEventListener('pointerleave', () => { if (down) sc.classList.remove('is-panning'); });
  /* evita arrastar imagem/seleção de texto */
  sc.addEventListener('dragstart', e => e.preventDefault());
}

/* enquadra o nó em foco no centro da área visível (com os passos anteriores à vista) */
function treeCenterFocus(z) {
  const sc = $('#treeScroll');
  const board = $('#treeBoard');
  if (!sc || !board) return;
  z = z || (parseFloat((board.style.transform.match(/scale\(([\d.]+)\)/) || [])[1]) || MAP.zoom || 1);
  const rootEl = $('.t-node--d0', board);
  if (!rootEl) { sc.scrollTop = 0; sc.scrollLeft = 0; return; }
  /* zera o pan antes de medir */
  MAP.pan = { x: 0, y: 0 };
  board.style.transform = `translate(0px, 0px) scale(${z})`;
  sc.scrollLeft = 0; sc.scrollTop = 0;

  const sr = sc.getBoundingClientRect();
  const rc = rootEl.getBoundingClientRect();
  const cxDesired = sr.left + sr.width * 0.5;
  const cyDesired = sr.top + sr.height * 0.46;
  const cxNow = rc.left + rc.width / 2;
  const cyNow = rc.top + rc.height / 2;

  /* primeiro usa a rolagem (quando há conteúdo além da área) */
  sc.scrollLeft = Math.max(0, sc.scrollWidth - sc.clientWidth ? (cxNow - cxDesired) : 0);
  sc.scrollTop = Math.max(0, sc.scrollHeight - sc.clientHeight ? (cyNow - cyDesired) : 0);

  /* depois completa com pan — assim o foco fica no centro mesmo em árvore pequena */
  const rc2 = rootEl.getBoundingClientRect();
  const dx = (sr.left + sr.width * 0.5) - (rc2.left + rc2.width / 2);
  const dy = (sr.top + sr.height * 0.46) - (rc2.top + rc2.height / 2);
  MAP.pan = { x: dx / z, y: dy / z };
  board.style.transform = `translate(${Math.round(MAP.pan.x)}px, ${Math.round(MAP.pan.y)}px) scale(${z})`;
}

function mapSeqPanel() {
  return `<div class="map-seq">
    <div class="map-seq-head">
      ${icon('layers', 15)}<b>Sequência do treino</b>
      <span class="map-seq-count">${MAP.seq.length} posiç${MAP.seq.length === 1 ? 'ão' : 'ões'}</span>
      ${MAP.seq.length ? `<button type="button" class="lnk" id="seqClear">limpar</button>` : ''}
    </div>
    ${MAP.seq.length ? `<ol class="map-seq-list">
      ${MAP.seq.map((s, i) => `<li>
        <span class="map-seq-i">${pad(i + 1)}</span>
        <span class="map-seq-body">
          <b>${esc(posName(s.pos))}</b>
          ${s.via ? `<small>${esc(KIND_LABELS[s.via.kind] || '')}${s.via.note ? ' · ' + esc(s.via.note) : ''}</small>` : '<small>ponto de partida</small>'}
        </span>
        <span class="map-seq-acts">
          <button type="button" data-seqmove="${i}" data-dir="-1" aria-label="Subir" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button type="button" data-seqmove="${i}" data-dir="1" aria-label="Descer" ${i === MAP.seq.length - 1 ? 'disabled' : ''}>↓</button>
          <button type="button" data-seqdel="${i}" aria-label="Remover">${icon('x', 12)}</button>
        </span>
      </li>`).join('')}
    </ol>` : `<div class="map-seq-empty">${icon('spark', 14)}<span>Toque no <b>+</b> de qualquer galho para montar a sequência da aula.</span></div>`}
  </div>`;
}

function mapBindGraph() {
  const host = $('#mapHost');
  if (!host) return;
  $$('[data-focus]', host).forEach(b => b.onclick = () => mapEnter(b.dataset.focus));
  $$('[data-seq]', host).forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const edge = mapEdges().find(m => m.id === b.dataset.edge);
    seqAdd(b.dataset.seq, edge);
  });
  $$('[data-expand]', host).forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    MAP.open = MAP.open || [];
    MAP.open.includes(b.dataset.expand) ? MAP.open = MAP.open.filter(x => x !== b.dataset.expand) : MAP.open.push(b.dataset.expand);
    mapRefresh();
  });
  $$('[data-seqdel]', host).forEach(b => b.onclick = () => seqRemove(Number(b.dataset.seqdel)));
  $$('[data-seqmove]', host).forEach(b => b.onclick = () => seqMove(Number(b.dataset.seqmove), Number(b.dataset.dir)));
  const back = $('#mapBack', host); if (back) back.onclick = () => mapPicker();
  const clear = $('#seqClear', host); if (clear) clear.onclick = () => { MAP.seq = []; mapRefresh(); };
  $$('[data-trail]', host).forEach(b => b.onclick = () => {
    const i = Number(b.dataset.trail);
    MAP.trail = MAP.trail.slice(0, i + 1);
    MAP.focus = MAP.trail[i];
    mapRefresh();
  });
  const addEdge = $('#mapAddEdge', host);
  if (addEdge) addEdge.onclick = () => mapEdgeForm();
  mapBindPan(host);
  treeApplyZoom();
  requestAnimationFrame(() => { treeRemeasure(); });
  const zi = $('#treeZoomIn', host), zo = $('#treeZoomOut', host), fit = $('#treeFit', host);
  if (zi) zi.onclick = () => { MAP.zoom = Math.min(1.6, (MAP.zoom || 1) + 0.1); treeApplyZoom('keep'); };
  if (zo) zo.onclick = () => { MAP.zoom = Math.max(0.4, (MAP.zoom || 1) - 0.1); treeApplyZoom('keep'); };
  if (fit) fit.onclick = () => { MAP.zoom = null; MAP.pan = { x: 0, y: 0 }; treeApplyZoom('all'); };
  /* destaca o caminho do nó sob o cursor */
  $$('.t-node', host).forEach(nd => {
    const id = nd.dataset.node;
    nd.addEventListener('pointerenter', () => {
      $$(`.t-edge[data-node="${id}"]`, host).forEach(p => p.classList.add('hot'));
      nd.classList.add('hot');
    });
    nd.addEventListener('pointerleave', () => {
      $$(`.t-edge[data-node="${id}"]`, host).forEach(p => p.classList.remove('hot'));
      nd.classList.remove('hot');
    });
  });
}

function mapEnter(nodeId) {
  if (MAP.focus !== nodeId) {
    if (!MAP.trail.length) MAP.trail = [nodeId];
    else if (MAP.trail[MAP.trail.length - 1] !== nodeId) MAP.trail.push(nodeId);
  }
  MAP.focus = nodeId;
  MAP.root = MAP.trail[0] || nodeId;
  mapRefresh();
}

function mapRefresh() {
  const host = $('#mapHost');
  if (!host) return;
  host.innerHTML = MAP.focus ? mapGraphBody() : mapPickerBody();
  if (MAP.focus) mapBindGraph(); else mapBindPicker();
  const done = $('#mapDone');
  if (done) done.innerHTML = MAP.seq.length ? `${icon('check', 13)} Usar ${MAP.seq.length} posiç${MAP.seq.length === 1 ? 'ão' : 'ões'}` : 'Usar sequência';
}

function mapPicker() {
  MAP.focus = null; MAP.trail = [];
  mapEnsurePositions();
  if (!MAP.seq.length && posDraft.selected.length) {
    MAP.seq = posDraft.selected.map(id => ({ pos: id, node: id, via: null }));
  }
  const page = $('#mapPage');
  $('#mapClose').innerHTML = icon('arrowLeft', 17);
  page.classList.add('show');
  page.setAttribute('aria-hidden', 'false');
  document.body.classList.add('map-open');
  mapRefresh();
}
function mapClosePage() {
  const page = $('#mapPage');
  page.classList.remove('show');
  page.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('map-open');
}
function mapCommit() {
  const chosen = MAP.seq.length ? MAP.seq.map(s => s.pos) : MAP.trail.map(id => cidOf(id));
  if (!chosen.length) { toast('Adicione posições à sequência primeiro.'); return; }
  posDraft.selected = [...new Set(chosen)];
  MAP.seq = []; MAP.trail = []; MAP.focus = null;
  mapClosePage();
  renderPosPicker();
  toast(`${posDraft.selected.length} posições no plano.`, { icon: 'checkCircle' });
}
$('#mapClose').onclick = mapClosePage;
$('#mapDone').onclick = mapCommit;

/* ---------- criar conexão (painel dentro da página) ---------- */
function mapEdgeForm() {
  const from = MAP.focus;
  const nodes = mapNodes().filter(n => n.id !== from && n.id !== cidOf(from));
  const host = $('#mapSheet');
  if (!host) return;
  host.innerHTML = `<div class="map-sheet-scrim" data-sheet-close></div>

    const kind = $('#edgeKind', host).value;
    const note = ($('#edgeNote', host).value || '').trim();
    if (!to) { toast('Escolha o destino.'); return; }
    if (mapEdges().some(m => (m.from === from && m.to === to) || (m.from === to && m.to === from))) { toast('Essa conexão já existe.'); return; }
    db.customMoves ||= [];
    db.customMoves.push({ id: 'cmv-' + uid(), from, to, kind, note });
    save();
    host.classList.remove('show');
    mapRefresh();
    toast('Conexão criada.', { icon: 'checkCircle' });
  };
  setTimeout(() => { const f = $('#edgeTo', host); if (f) f.focus(); }, 60);
}

   16. FICHA DO ALUNO (drawer)
   ============================================================ */
function profileCalendarHTML(s, month) {
  const [y, mo] = month.split('-').map(Number);
  const offset = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const n = daysInMonth(month);
  const dates = studentDates(s.id);
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<div class="cell cell--empty"></div>';
  for (let day = 1; day <= n; day++) {
    const date = `${month}-${pad(day)}`;
    const present = dates.includes(date);
    cells += `<div class="cell ${present ? 'cell--present' : ''} ${date === TODAY_ISO ? 'cell--today' : ''} ${date > TODAY_ISO ? 'cell--future' : ''}"
      ${present ? `data-tip="${esc(dateBR(date) + '\nPresença registrada')}"` : ''}>${day}</div>`;
  }
  return `<div class="heat">${['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}

/* ---------- carência de pagamento: vencimento + 3 dias úteis ---------- */
const LATE_GRACE_WORKDAYS = 3;
/* soma N dias úteis (seg–sex) a partir de uma data ISO */
function addWorkdays(isoDate, n) {
  const d = parseD(isoDate);
  let added = 0;
  while (added < n) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) added++;
  }
  return iso(d);
}
/* limite da carência: ainda "pendente" até esse dia (inclusive) */
const payDeadline = p => addWorkdays(p.dueDate || TODAY_ISO, LATE_GRACE_WORKDAYS);
/* status efetivo exibido: pago · pendente (no prazo) · atrasado (passou dos 3 dias úteis) */
function payState(p) {
  if (!p) return 'pendente';
  if (p.status === 'Pago') return 'pago';
  return TODAY_ISO > payDeadline(p) ? 'atrasado' : 'pendente';
}
const isLatePayment = p => payState(p) === 'atrasado';
/* dias úteis restantes de carência (negativo = já passou) */
function payWorkdaysLeft(p) {
  const lim = payDeadline(p);
  if (TODAY_ISO > lim) return 0;
  let n = 0, d = parseD(TODAY_ISO);
  while (iso(d) < lim) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) n++;
  }
  return n;
}

/* ---------- histórico financeiro do aluno (drawer) ---------- */
function financeHistoryHTML(s) {
  const all = db.payments.filter(p => p.studentId === s.id)
    .sort((a, b) => (b.month || '').localeCompare(a.month || ''));
  const paid = all.filter(p => p.status === 'Pago');
  const open = all.filter(p => p.status !== 'Pago');
  const late = open.filter(isLatePayment);
  const paidSum = sum(paid, p => p.amount);
  const openSum = sum(open, p => p.amount);
  const ticket = all.length ? (paidSum + openSum) / all.length : 0;
  const first = all.length ? all[all.length - 1].month : null;
  const monthsOn = first ? Math.max(1, Math.round((parseD(MONTH + '-01') - parseD(first + '-01')) / 2629800000) + 1) : 0;
  const adimplencia = all.length ? Math.round((paid.length / all.length) * 100) : 100;
  const catOf = id => Number(String(id || '').slice(0, 4)) || 0;
  const byYear = {};
  paid.forEach(p => { const y = catOf(p.month); byYear[y] = (byYear[y] || 0) + Number(p.amount || 0); });
  const maxY = Math.max(1, ...Object.values(byYear));

  const kpi = (label, value, note, tone) => `<div class="fh-kpi ${tone || ''}">
    <span>${label}</span><b>${value}</b><small>${note}</small></div>`;

  return `<div class="drawer-head">

      <button class="avatar avatar--btn" data-act="open-profile" data-id="${s.id}" title="Abrir a ficha de ${esc(s.name)}" aria-label="Abrir a ficha de ${esc(s.name)}">${esc((s.name || '?').charAt(0))}</button>

        <div class="eyebrow" style="display:flex;align-items:center;gap:6px">Histórico financeiro
          <button class="fh-to-profile" data-act="open-profile" data-id="${s.id}" title="Abrir a ficha do aluno">
            ${icon('userPlus', 12)} ficha do aluno
          </button>
        </div>
        <h2 id="drawerTitle" style="font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:2px">
          <button class="fh-name" data-act="open-profile" data-id="${s.id}" title="Abrir a ficha de ${esc(s.name)}">${esc(s.name)}${icon('arrowUpRight', 16)}</button>
        </h2>
        <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">
          ${statusBadge(s.status)}
          <span class="badge badge--outline">${esc(groupOf(s))}</span>
          <span class="badge badge--outline">${esc(s.plan || 'Mensal')} · ${money(s.fee)}</span>
          <span class="badge badge--outline">vence dia ${esc(s.dueDay || 10)}</span>
        </div>
      </div>
    </div>
    <button class="close-x" data-close-drawer aria-label="Fechar">${icon('x', 17)}</button>
  </div>
  <div class="drawer-body">
    <div class="fh-kpis">
      ${kpi('Pago', money(paidSum), `${paid.length} mensalidade${paid.length === 1 ? '' : 's'}`, 'ok')}
      ${kpi('Em aberto', money(openSum), late.length ? `${late.length} em atraso` : 'nada atrasado', open.length ? 'warn' : '')}
      ${kpi('Adimplência', adimplencia + '%', `${monthsOn} mês${monthsOn === 1 ? '' : 'es'} de casa`)}
      ${kpi('Ticket médio', money(ticket), 'por mês')}
    </div>

    ${open.length ? `<div class="fh-alert ${late.length ? 'fh-alert--late' : ''}">
      ${icon('alert', 14)}
      <div><b>${money(openSum)}</b> em aberto${late.length ? ` — ${late.map(p => waMonthShort(p.month)).join(', ')}` : ` · ${open.map(p => waMonthShort(p.month)).join(', ')}`}</div>
      <button class="btn btn--sm" data-act="wa-send" data-id="${open[0].id}">${icon('whatsapp', 13)} Cobrar</button>
    </div>` : `<div class="fh-alert fh-alert--ok">${icon('checkCircle', 14)} <b>Tudo em dia</b> — nenhuma mensalidade em aberto.</div>`}

    <div class="fh-year">
      ${Object.keys(byYear).sort().map(y => `<div class="fh-year-row" title="Pago em ${y}">
        <span>${y}</span>
        <div class="fh-track"><i style="width:${Math.round((byYear[y] / maxY) * 100)}%"></i></div>
        <b>${money(byYear[y])}</b>
      </div>`).join('') || '<div class="small dim">Sem lançamentos ainda.</div>'}
    </div>

    <div class="fh-title">${icon('wallet', 14)} Extrato mês a mês <span class="small dim">${all.length} lançamentos</span></div>
    <div class="fh-list">
      ${all.length ? all.map(p => {
        const isLate = isLatePayment(p);

    </div>
  </div>`;
}

/* ============================================================
   NUVEM (Supabase) — banco compartilhado entre os professores
   ------------------------------------------------------------
   • Sem configuração, o app roda 100% local (como sempre).
   • Configurado, a base vive no Supabase e a sessão é por pessoa.
   • A chave publishable/anon pode ficar aqui: quem protege os dados
     são as políticas de RLS no banco, não o segredo da chave.
   • NUNCA coloque a chave service_role/secret neste arquivo.
   ============================================================ */
const CLOUD = {
  url: '',          /* ex.: https://abcd1234.supabase.co  */
  key: '',          /* chave publishable/anon             */
  user: null,       /* { id, email, nome, papel }         */
  ativo: false,
  erro: '',
  salvando: false,
  pendente: false,
  ultimo: 0,
  canal: null
};
/* Quem entra no dojo. A tela de login mostra só estes nomes — o e-mail de
   autenticação é montado a partir do nome (nick@dojoarandu.local etc.). */
const EQUIPE = [
  { nome: 'Steven',   login: 'steven',   email: 'steven@dojoarandu.local' },
  { nome: 'Nicholas', login: 'nicholas', email: 'nicholas@dojoarandu.local' },
  { nome: 'Anderson', login: 'anderson', email: 'anderson@dojoarandu.local' }
];
const acharEquipe = (loginOuEmail) => {
  const t = String(loginOuEmail || '').trim().toLowerCase();
  if (!t) return null;
  return EQUIPE.find(p => p.login === t) || EQUIPE.find(p => p.email === t) || null;
};
const cloudConfigurado = () => !!(CLOUD.url && CLOUD.key);
const cloudSessionKey = 'arandu-cloud-session';

/* chamada simples à API REST do Supabase */
async function cloudFetch(path, opts = {}) {
  const resp = await fetch(CLOUD.url.replace(/\/$/, '') + path, {
    ...opts,
    headers: {
      'apikey': CLOUD.key,
      'Authorization': 'Bearer ' + ((CLOUD.user && CLOUD.user.token) || CLOUD.key),
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...(opts.headers || {})
    }
  });
  const txt = await resp.text();
  const body = txt ? (() => { try { return JSON.parse(txt); } catch (e) { return txt; } })() : null;
  if (!resp.ok) {
    const msg = (body && (body.msg || body.message || body.error_description || body.error)) || ('HTTP ' + resp.status);
    throw new Error(msg);
  }
  return body;
}

async function cloudLogin(email, senha) {
  const r = await cloudFetch('/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + CLOUD.key },
    prefer: '',
    body: JSON.stringify({ email, password: senha })
  });
  CLOUD.user = {
    id: r.user.id, email: r.user.email, token: r.access_token,
    refresh: r.refresh_token, expira: Date.now() + (r.expires_in || 3600) * 1000
  };
  await cloudCarregarPerfil();
  try { localStorage.setItem(cloudSessionKey, JSON.stringify(CLOUD.user)); } catch (e) {}
  CLOUD.ativo = true;
  return CLOUD.user;
}

async function cloudCarregarPerfil() {
  const buscar = async () => {
    const linhas = await cloudFetch(`/rest/v1/perfis?id=eq.${CLOUD.user.id}&select=nome,papel`, {
      headers: { 'Cache-Control': 'no-cache' }
    });
    return Array.isArray(linhas) ? linhas[0] : null;
  };
  let perfil = null, falhou = false;
  try { perfil = await buscar(); } catch (e) { falhou = true; }
  if (!perfil && !falhou) {
    /* banco respondendo mas sem a linha: pode ser cache da resposta — tenta uma vez mais */
    try { perfil = await buscar(); } catch (e) { falhou = true; }
  }
  if (perfil) {
    CLOUD.user.nome = perfil.nome || CLOUD.user.email;
    CLOUD.user.papel = perfil.papel || 'professor';
    CLOUD.user.perfilErro = '';
    return;
  }
  /* não achou: deixa claro que o papel mostrado é um palpite, não o do banco */
  CLOUD.user.nome = CLOUD.user.email;
  CLOUD.user.papel = 'professor';
  CLOUD.user.perfilErro = falhou
    ? 'Não foi possível ler seu perfil agora.'
    : 'Seu perfil ainda não existe na tabela perfis — rode o SQL de perfis com o seu e-mail.';
}

async function cloudSessaoSalva() {
  if (!cloudConfigurado()) return false;
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(cloudSessionKey) || 'null'); } catch (e) {}
  if (!salvo || !salvo.refresh) return false;
  try {
    const r = await cloudFetch('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + CLOUD.key }, prefer: '',
      body: JSON.stringify({ refresh_token: salvo.refresh })
    });
    CLOUD.user = { ...salvo, token: r.access_token, refresh: r.refresh_token, expira: Date.now() + (r.expires_in || 3600) * 1000 };
    await cloudCarregarPerfil();
    CLOUD.ativo = true;
    try { localStorage.setItem(cloudSessionKey, JSON.stringify(CLOUD.user)); } catch (e) {}
    return true;
  } catch (e) { return false; }
}

/* ---- primeiro contato: decide o sentido da primeira sincronização ----
   Banco vazio + base local com dados  → SOBE a base local (nunca apaga).
   Banco com dados                      → traz do banco.
   Nada nos dois lados                   → segue vazio, sem drama. */
async function cloudPrimeiroContato() {
  const antes = {
    students: (db.students || []).length,
    payments: (db.payments || []).length,
    trainings: (db.trainings || []).length
  };
  const temLocal = antes.students > 0 || antes.payments > 0 || antes.trainings > 0;

  /* PERGUNTA ao banco antes de tocar na base: ler e trocar são coisas diferentes */
  const linhas = await cloudFetch('/rest/v1/dojo_docs?select=doc_id');
  const vazio = !Array.isArray(linhas) || linhas.length === 0;

  if (vazio && temLocal) {
    /* banco de estreia: sobe a base deste aparelho, sem passar por cima de nada */
    CLOUD.pendente = true;
    await cloudPushAgora();
    if (CLOUD.erro) { toast('Banco vazio, mas o envio falhou: ' + CLOUD.erro + '. A base deste aparelho continua intacta.', { icon: 'alert' }); return; }
    toast(`Banco vazio — subi a base deste aparelho (${antes.students} alunos).`, { icon: 'checkCircle' });
    return;
  }
  if (vazio && !temLocal) return;                /* nada dos dois lados */

  /* o banco tem dados: aí sim ele manda */
  await cloudPull();
  if (antes.students > (db.students || []).length) {
    toast('A base do banco entrou no lugar da local. Se quiser voltar a sua, use "Enviar esta base".', { icon: 'alert' });
  }
}

/* ---- leitura: junta os documentos do banco num único objeto db ---- */
async function cloudPull() {
  const linhas = await cloudFetch('/rest/v1/dojo_docs?select=doc_id,data,versao,atualizado_em');
  if (!Array.isArray(linhas)) throw new Error('resposta inesperada do banco');
  const novo = BLANK();
  const etapa = {};      /* memória da chamada por dia */
  const aberto = {};
  linhas.forEach(l => {
    const d = l.data || {};
    if (l.doc_id === 'alunos') novo.students = d.lista || [];
    else if (l.doc_id === 'pagamentos') novo.payments = d.lista || [];
    else if (l.doc_id === 'despesas') novo.expenses = d.lista || [];
    else if (l.doc_id === 'treinos') novo.trainings = d.lista || [];
    else if (l.doc_id === 'visitas') novo.visitors = d.lista || [];
    else if (l.doc_id === 'posicoes') novo.customPositions = d.lista || [];
    else if (l.doc_id.startsWith('chamada:')) {
      const dia = l.doc_id.slice(8);
      etapa[dia] = d.presentes || [];
      if (d.aberto) aberto[dia] = d.aberto;
    }
  });
  novo.attendance = etapa;
  novo.attendanceOpen = aberto;
  const vazio = !linhas.length;
  db = novo;
  /* guarda local como cópia de segurança (e para abrir offline) */
  save({ local: true });
  return { db: novo, vazio };
}

/* ---- escrita: quebra o db em documentos e envia só o que mudou ---- */
let cloudPushTimer = null;
function cloudPush() {
  if (!CLOUD.ativo) return;
  CLOUD.pendente = true;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(cloudPushAgora, 900);   /* agrupa várias edições seguidas */
}

function cloudDocs() {
  const docs = [
    ['alunos', { lista: db.students || [] }],
    ['pagamentos', { lista: db.payments || [] }],
    ['despesas', { lista: db.expenses || [] }],
    ['treinos', { lista: db.trainings || [] }],
    ['visitas', { lista: db.visitors || [] }],
    ['posicoes', { lista: db.customPositions || [] }]
  ];
  Object.keys(db.attendance || {}).forEach(dia => {
    docs.push(['chamada:' + dia, { presentes: db.attendance[dia] || [], aberto: (db.attendanceOpen || {})[dia] || null }]);
  });
  return docs;
}

async function cloudPushAgora() {
  if (!CLOUD.ativo || CLOUD.salvando) return;
  CLOUD.salvando = true; cloudPintar();
  try {
    const linhas = cloudDocs().map(([doc_id, data]) => ({
      doc_id, data, atualizado_por: CLOUD.user.id,
      atualizado_em: new Date().toISOString()
    }));
    await cloudFetch('/rest/v1/dojo_docs?on_conflict=doc_id', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      body: JSON.stringify(linhas)
    });
    CLOUD.pendente = false; CLOUD.erro = ''; CLOUD.ultimo = Date.now();
  } catch (e) {
    CLOUD.erro = e.message || 'falha ao enviar';
  } finally {
    CLOUD.salvando = false;
    cloudPintar();
  }
}

/* ---- atualização entre aparelhos: busca o banco a cada 20 s e ao voltar para a aba ---- */
let cloudPollTimer = null;
function cloudPoll() {
  clearInterval(cloudPollTimer);
  if (!CLOUD.ativo) return;
  const sincronizar = async (forcar) => {
    if (!CLOUD.ativo || CLOUD.salvando || CLOUD.pendente) return;
    if (document.visibilityState === 'hidden' && !forcar) return;
    try {
      const antes = JSON.stringify(db);
      CLOUD.recebendo = true; cloudPintar();
      await cloudPull();
      CLOUD.recebendo = false;
      if (JSON.stringify(db) !== antes) { scheduleRender(); }
      CLOUD.erro = '';
    } catch (e) { CLOUD.recebendo = false; CLOUD.erro = e.message || 'sem conexão'; }
    cloudPintar();
  };
  cloudPollTimer = setInterval(() => sincronizar(false), 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(true); });
  window.addEventListener('online', () => sincronizar(true));
}

async function cloudSair() {
  clearTimeout(cloudPushTimer);
  try { await cloudPushAgora(); } catch (e) {}
  CLOUD.ativo = false; CLOUD.user = null;
  try { localStorage.removeItem(cloudSessionKey); } catch (e) {}
  toast('Sessão encerrada. O app voltou ao modo local.', { icon: 'checkCircle' });
  render();
}

/* ============================================================
   COFRE — a base real vem cifrada no arquivo e só abre com o PIN
   ------------------------------------------------------------
   O arquivo público não tem nomes nem telefones legíveis: os dados
   reais estão em AES-GCM (chave derivada do PIN por PBKDF2). Quem
   abre sem o PIN usa a base de demonstração.
   ============================================================ */
const COFRE_KEY = 'arandu-cofre-sessao';

async function cofreAbrir(entrada) {
  const cfg = typeof COFRE !== 'undefined' && COFRE && COFRE.real;
  if (!cfg) return null;                       /* app de desenvolvimento: sem cofre */
  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const salt = b64(cfg.salt);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(entrada), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: cfg.iter, hash: 'SHA-256' }, base, 256);
  const chave = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(cfg.iv) }, chave, b64(cfg.ct));
  return JSON.parse(new TextDecoder().decode(claro));
}

/* aplica uma base recém-importada (real ou de demonstração) */
function aplicarBase(dados, origem, rotulo, arquivo) {
  db = dados;
  /* garante as chaves que o app espera */
  ['students','payments','expenses','attendance','attendanceOpen','trainings','visitors','customPositions']
    .forEach(k => { if (!db[k]) db[k] = (k === 'attendance' || k === 'attendanceOpen') ? {} : []; });
  baseSnapshotMeta(origem, arquivo, db);
  BASE.label = rotulo;
  save({ local: true });
  view.baseModo = origem;
}

/* ao abrir: pede o PIN do dojo (ou libera direto se já foi digitado nesta aba) */
async function abrirGate() {

/* ---- indicador discreto do estado da nuvem na barra superior ---- */
function cloudPintar() {
  const el = $('#cloudDot');
  if (!el) return;
  if (!el.dataset.pronto) {
    el.innerHTML = `<span class="nuvem-ico">${icon('cloud', 17)}</span><span class="dot-estado"></span>`;
    el.dataset.pronto = '1';
  }
  if (!cloudConfigurado() || !CLOUD.ativo) { el.hidden = true; return; }
  el.hidden = false;
  const online = navigator.onLine !== false;
  let estado = 'ok', rotulo = '';
  if (!online) { estado = 'offline'; rotulo = 'Sem internet — a base fica só neste aparelho até a conexão voltar.'; }
  else if (CLOUD.erro) { estado = 'erro'; rotulo = 'Falha ao falar com o banco: ' + CLOUD.erro; }
  else if (CLOUD.salvando) { estado = 'enviando'; rotulo = 'Enviando para o banco…'; }
  else if (CLOUD.pendente) { estado = 'enviando'; rotulo = 'Alterações na fila para enviar.'; }
  else if (CLOUD.recebendo) { estado = 'recebendo'; rotulo = 'Buscando novidades do banco…'; }
  else if (CLOUD.ultimo) { estado = 'ok'; rotulo = 'Tudo salvo na nuvem · último envio ' + new Date(CLOUD.ultimo).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  else { estado = 'ok'; rotulo = 'Conectado ao banco compartilhado.'; }
  el.dataset.estado = estado;
  el.title = rotulo;
  el.setAttribute('aria-label', 'Nuvem: ' + rotulo);
}

  if (acao === 'recebendo') { CLOUD.recebendo = true; cloudPintar(); }
  try { return acao ? await acao() : undefined; }
  finally {

}

function pwaIconData(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#e0553a'); g.addColorStop(1, '#b3371f');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  x.fillStyle = '#fff7f2'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `${Math.round(size * 0.56)}px Georgia, "Times New Roman", serif`;
  x.fillText('道', size / 2, size * 0.54);
  return c.toDataURL('image/png');
}
function pwaSetup() {
  /* Preferência: manifest.webmanifest + ícones PNG reais, servidos ao lado do app.
     O Chrome só empacota o app (WebAPK) com arquivos de verdade — manifest em blob
     e ícone em data: URL concluem a instalação mas não criam ícone na tela inicial. */
  const base = location.href.replace(/[^/]*$/, '');
  const head = (tag, attrs) => { const el = document.createElement(tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); document.head.appendChild(el); return el; };
  const useBlob = () => {
    /* modo arquivo único: manifest em memória (serve para o iPhone, limita o Android) */
    const icons = [192, 512].map(sz => ({ src: pwaIconData(sz), sizes: sz + 'x' + sz, type: 'image/png', purpose: 'any' }));
    const here = location.href.split('#')[0];
    const url = URL.createObjectURL(new Blob([JSON.stringify({
      name: 'Arandu · Sistema do Dojo', short_name: 'Arandu', start_url: here,
      scope: here.replace(/[^/]*$/, ''), display: 'standalone',
      background_color: '#0f1117', theme_color: '#c4432c', icons
    })], { type: 'application/manifest+json' }));
    head('link', { rel: 'manifest', href: url });
    head('link', { rel: 'apple-touch-icon', href: pwaIconData(180) });
  };
  try {
    if (!/^https?:$/.test(location.protocol)) { useBlob(); }
    else {
      /* registra o manifest real; a checagem roda em segundo plano e só
         cai no blob se o arquivo não existir (app de arquivo único) */
      /* manifest e apple-touch-icon já vêm declarados no <head>; aqui só
         conferimos se o arquivo existe e, se não, caímos no modo blob */
      const link = document.querySelector('link[rel="manifest"]') || head('link', { rel: 'manifest', href: base + 'manifest.webmanifest' });
      fetch(base + 'manifest.webmanifest', { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('sem manifest'); return r.json(); })
        .then(j => { if (!Array.isArray(j.icons) || !j.icons.length) throw new Error('sem ícones'); })
        .catch(() => { link.remove(); useBlob(); });
    }
    head('meta', { name: 'theme-color', content: '#c4432c' });
    head('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
    head('meta', { name: 'apple-mobile-web-app-title', content: 'Arandu' });
    head('meta', { name: 'mobile-web-app-capable', content: 'yes' });
  } catch (e) {}
  /* service worker: só existe em http(s) — é o que libera o instalador do navegador.
     Em file:// o app continua funcionando, mas o atalho precisa de um endereço de verdade. */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const h = $('#installHint'); if (h) h.textContent = installHintText(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Atalho criado na tela inicial.', { icon: 'checkCircle' }); render(); });
}
function installApp() {
  if (isStandalone()) { toast('O Arandu já está instalado neste aparelho.', { icon: 'checkCircle' }); return; }
  if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice?.then(() => { deferredInstall = null; render(); }); return; }
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  confirmDialog({

      ? 'No iPhone/iPad o Safari faz isso pelo menu Compartilhar:\n\n1. Toque em Compartilhar (o quadrado com a flecha).\n2. Escolha “Adicionar à Tela de Início”.\n3. Confirme o nome Arandu e toque em Adicionar.'
      : 'Neste navegador o instalador automático não está disponível.\n\nNo Chrome do Android: menu ⋮ → “Instalar app” ou “Adicionar à tela inicial”.\nNo computador: ícone de instalar na barra de endereço.'
  });
}

function updateThemeButton() {
  const btn = $('#themeToggle');
  if (!btn) return;                     /* v2.39: o controle de tema ficou no menu */

function cycleTheme() {
  prefs.theme = prefs.theme === 'light' ? 'dark' : prefs.theme === 'dark' ? 'auto' : 'light';
  savePrefs(); applyTheme();
  const applied = document.documentElement.getAttribute('data-theme');
  const msg = prefs.theme === 'auto' ? `Tema do sistema (${applied === 'dark' ? 'escuro' : 'claro'})` : prefs.theme === 'dark' ? 'Tema escuro' : 'Tema claro';

/* ============================================================
   19. EXPORTAR / IMPORTAR
   ============================================================ */
function download(name, content, type = 'application/json') {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportBackup() {
  download(`arandu-backup-${TODAY_ISO}.json`, JSON.stringify(db, null, 2));
  toast('Backup baixado.', { icon: 'download' });
}
function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.students)) throw new Error('formato');
        const ok = await confirmDialog({
          title: 'Importar backup', confirmText: 'Importar',
          message: `O arquivo tem ${data.students.length} alunos e ${(data.payments || []).length} mensalidades.\nOs dados atuais serão substituídos.`
        });
        if (!ok) return;
        db = Object.assign(BLANK(), data);
        db.trainings ||= []; db.visitors ||= []; db.customPositions ||= [];
        db.attendance ||= {}; db.attendanceOpen ||= {};
        baseSnapshotMeta('import', file.name, db);
        save(); render(); toast('Backup importado.', { icon: 'checkCircle' });
      } catch (e) { toast('Arquivo inválido — envie um JSON do Arandu.'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function exportCSV() {
  const rows = [];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  if (view.page === 'financeiro' && view.tab === 'despesas') {
    rows.push(['Data', 'Descrição', 'Categoria', 'Quantidade', 'Forma', 'Valor']);
    expensesOf(view.expMonth).sort((a, b) => (a.date || '').localeCompare(b.date || ''))
      .forEach(e => rows.push([e.date, e.description, e.category, e.quantity || '', e.method, String(e.amount).replace('.', ',')]));
  } else if (view.page === 'financeiro' && view.tab === 'relatorios') {
    rows.push(['Mês', 'Receita', 'Despesas', 'Saldo', 'Presenças']);
    lastMonths(12, view.repMonth).forEach(m => {
      const rev = sum(paymentsOf(m).filter(p => p.status === 'Pago'), p => p.amount);
      const exp = sum(expensesOf(m), e => e.amount);
      const freq = Object.keys(db.attendance).filter(d => d.startsWith(m)).reduce((a, d) => a + attendanceOf(d).length, 0);
      rows.push([m, String(rev).replace('.', ','), String(exp).replace('.', ','), String(rev - exp).replace('.', ','), freq]);
    });
  } else if (view.page === 'financeiro') {
    rows.push(['Aluno', 'Mês', 'Vencimento', 'Valor', 'Status', 'Pago em', 'Forma']);
    paymentsOf(view.payMonth).forEach(p => {
      const s = studentById(p.studentId);
      rows.push([s?.name || '', p.month, p.dueDate, String(p.amount).replace('.', ','), p.status, p.paidAt || '', p.method || '']);
    });
  } else {
    rows.push(['Aluno', 'Turma', 'Faixa', 'Graus', 'Idade', 'Telefone', 'Localidade', 'Plano', 'Mensalidade', 'Status', 'Freq. semana', 'Freq. mês', 'Freq. ano']);
    db.students.forEach(s => rows.push([s.name, groupOf(s), s.belt, degreeOf(s), s.age || '', s.phone || '', s.locality || '', s.plan || '', s.fee, s.status,
      freqCount(s.id, 'week'), freqCount(s.id, 'month'), freqCount(s.id, 'year')]));
  }
  const csv = '\ufeff' + rows.map(r => r.map(q).join(';')).join('\n');
  const name = `arandu-${view.page === 'financeiro' ? view.tab : 'alunos'}-${TODAY_ISO}.csv`;
  download(name, csv, 'text/csv;charset=utf-8');
  toast('CSV exportado.', { icon: 'download' });
}

   ============================================================ */
let cmdItems = [], cmdIndex = 0;
function cmdSources() {
  const pages = NAV.concat([{ page: 'ajustes', label: 'Ajustes', icon: 'settings' }]).map(p => ({
    group: 'Ir para', label: p.label, icon: p.icon, hint: '', run: () => go(p.page)
  }));
  const actions = [
    { label: 'Nova matrícula', icon: 'userPlus', run: () => studentForm() },
    { label: 'Registrar pagamento', icon: 'wallet', run: () => paymentForm() },
    { label: 'Lançar despesa', icon: 'receipt', run: () => expenseForm() },
    { label: 'Registrar visita', icon: 'users', run: () => visitorForm() },
    { label: 'Planejar treino', icon: 'layers', run: () => trainingForm() },
    { label: 'Abrir chamada de hoje', icon: 'check', run: () => go('frequencia', { state: { attDate: TODAY_ISO } }) },
    { label: 'Baixar backup', icon: 'download', run: () => exportBackup() },
    { label: 'Exportar CSV', icon: 'list', run: () => exportCSV() },
    { label: 'Alternar tema', icon: 'moon', run: () => cycleTheme() },
    { label: 'Carregar demonstração', icon: 'spark', run: () => ACTIONS['load-demo']() }
  ].map(a => ({ ...a, group: 'Ações', hint: '' }));
  const students = db.students.map(s => ({
    group: 'Alunos', label: s.name, icon: 'users', hint: groupOf(s), run: () => openProfile(s.id)
  }));
  return [...pages, ...actions, ...students];
}
function openCmdk() {
  $('#cmdkWrap').classList.add('show');
  $('#cmdkWrap').setAttribute('aria-hidden', 'false');
  const input = $('#cmdkInput');
  input.value = '';
  cmdItems = cmdSources();
  cmdIndex = 0;
  renderCmdk('');
  setTimeout(() => input.focus(), 30);
}
function closeCmdk() {
  $('#cmdkWrap').classList.remove('show');
  $('#cmdkWrap').setAttribute('aria-hidden', 'true');
}
function renderCmdk(q) {
  const query = q.trim().toLowerCase();
  const filtered = cmdItems.filter(i => !query || i.label.toLowerCase().includes(query) || i.group.toLowerCase().includes(query));
  const limited = [];
  const seen = {};
  filtered.forEach(i => { seen[i.group] = (seen[i.group] || 0) + 1; if (seen[i.group] <= (query ? 8 : 3)) limited.push(i); });
  cmdIndex = Math.min(cmdIndex, Math.max(0, limited.length - 1));
  if (!limited.length) {
    $('#cmdkList').innerHTML = `<div class="cmdk-empty">Nada encontrado para “${esc(q)}”.</div>`;
    return;
  }
  let html = '', group = null;
  limited.forEach((item, i) => {
    if (item.group !== group) { group = item.group; html += `<div class="cmdk-group">${esc(group)}</div>`; }
    html += `<button class="cmdk-item" role="option" data-cmd="${i}" aria-selected="${i === cmdIndex}">
      <span class="ico">${icon(item.icon, 15)}</span><span>${esc(item.label)}</span>
      ${item.hint ? `<span class="hint">${esc(item.hint)}</span>` : ''}
    </button>`;
  });
  $('#cmdkList').innerHTML = html;
  $$('[data-cmd]').forEach(b => b.onclick = () => {
    const item = limited[Number(b.dataset.cmd)];
    closeCmdk(); item.run();
  });
  cmdItems._limited = limited;
}

$('#scrim').addEventListener('click', () => {

  closeDrawer();
  $('#scrim').classList.remove('show');
});
$('#cmdkOpen').addEventListener('click', openCmdk);
/* no login por nome: Enter na senha entra */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'cloudSenha') ACTIONS['cloud-entrar']();
});
/* os botões de tema e ajustes saíram da barra: agora vivem no menu de páginas */
$('#themeToggle')?.addEventListener('click', () => cycleTheme());

$('#cmdkInput').addEventListener('input', e => { cmdIndex = 0; renderCmdk(e.target.value); });
$('#cmdkInput').addEventListener('keydown', e => {
  const list = cmdItems._limited || [];
  if (!list.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdIndex = (cmdIndex + 1) % list.length; renderCmdk($('#cmdkInput').value); }
  if (e.key === 'ArrowUp') { e.preventDefault(); cmdIndex = (cmdIndex - 1 + list.length) % list.length; renderCmdk($('#cmdkInput').value); }
  if (e.key === 'Enter') { e.preventDefault(); const item = list[cmdIndex]; closeCmdk(); item && item.run(); }
});
$('#cmdkWrap').addEventListener('click', e => { if (e.target === $('#cmdkWrap')) closeCmdk(); });

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); return; }
  if (e.key === 'Escape') {
    if ($('#cmdkWrap').classList.contains('show')) { closeCmdk(); return; }
    if ($('#modalWrap').classList.contains('show')) {
      $('#modalWrap').classList.remove('show'); $('#modalWrap').setAttribute('aria-hidden', 'true'); $('#modalWrap').innerHTML = '';
      $('#scrim').classList.remove('show');
      return;
    }
    if ($('#drawer').classList.contains('show')) { closeDrawer(); return; }
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { h: 'hoje', a: 'alunos', f: 'frequencia', t: 'treinos', c: 'financeiro', d: 'ajustes' };
  if (map[e.key.toLowerCase()]) { go(map[e.key.toLowerCase()]); return; }
  if (e.key.toLowerCase() === 'n') { e.preventDefault(); studentForm(); }
  if (e.key === '/') { e.preventDefault(); openCmdk(); }
});

window.addEventListener('hashchange', () => {
  const p = location.hash.replace('#', '');
  if (PAGES[p] && p !== view.page) { view.page = p; render(); }
});

function bindCharts() {
  requestAnimationFrame(() => {
    $$('.ring .prog').forEach(el => {
      const r = Number(el.getAttribute('r')) || 50;
      const c = 2 * Math.PI * r;
      const p = Number(el.dataset.ring || 0);
      el.style.strokeDasharray = c;
      el.style.strokeDashoffset = c;
      requestAnimationFrame(() => { el.style.strokeDashoffset = c - (c * p) / 100; });
    });
  });
}

/* dock: esconde ao rolar para baixo, volta ao subir */
(() => {
  const dock = document.querySelector('.dock');
  if (!dock) return;
  return; /* v2.04: o dock retrai para o botão flutuante */

  let lastY = window.scrollY || 0, ticking = false;
  const update = () => {
    ticking = false;
    const y = window.scrollY || 0;
    const delta = y - lastY;
    if (Math.abs(delta) < 6) return;
    const nearTop = y < 90;
    const goingDown = delta > 0;
    dock.classList.toggle('is-hidden', !nearTop && goingDown);
    lastY = y;
  };
  window.addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
})();

function detectLowFX() {
  const nav = navigator;
  const weak = (nav.hardwareConcurrency && nav.hardwareConcurrency <= 4) ||
               (nav.deviceMemory && nav.deviceMemory <= 4) ||
               (nav.connection && nav.connection.saveData);
  if (weak) document.documentElement.classList.add('lowfx');
}
function boot() {
  detectLowFX();

  load();
  const hash = location.hash.replace('#', '');
  if (PAGES[hash]) view.page = hash;
  applyTheme();
  render();
  menuInit();
  topbarInit();
  pwaSetup();
  cloudInit();
  cloudPintar();
  setInterval(cloudPintar, 5000);     /* mantém o ponto fiel mesmo sem evento */
  abrirGate();
  /* lembrete automático: varre os vencimentos do dia ao abrir o app */
  try { waAutoRun(); render(); } catch (e) {}
}
boot();
