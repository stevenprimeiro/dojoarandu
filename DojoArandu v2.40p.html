}

/* painel da sequência */
.map-toolbar--map{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.map-toolbar--map::-webkit-scrollbar{display:none}
.map-toolbar--map .map-trail{min-width:0;flex-wrap:nowrap;overflow:hidden}
.map-toolbar--map .map-trail-step{white-space:nowrap}
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start}
.map-main{min-width:0}
.map-side{min-width:0}
.map-side .map-seq{margin-top:0;position:sticky;top:0;max-height:calc(100vh - 210px);overflow:auto;overscroll-behavior:contain}
@media(max-width:1080px){
  .map-layout{grid-template-columns:1fr}
  .map-side .map-seq{margin-top:14px;position:static;max-height:none}
}
.map-seq{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:13px 14px}
.map-seq-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--vermilion);margin-bottom:10px}
.map-seq-head b{color:var(--ink)}
.map-seq-count{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--vermilion) 14%,transparent);color:var(--vermilion-ink)}
.map-seq-head .lnk{margin-left:auto;font-size:11px;color:var(--ink-3);text-decoration:underline}
.map-seq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.map-seq-list li{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:11px;background:color-mix(in srgb,var(--paper) 55%,transparent);border:1px solid var(--line-2)}
.map-seq-i{font:600 10px/1 var(--mono);color:var(--vermilion);width:20px;flex:none}
.map-seq-body{flex:1;min-width:0;display:flex;flex-direction:column}
.map-seq-body b{font-size:12.5px;letter-spacing:-.01em}
.map-seq-body small{font-size:10.5px;color:var(--ink-3)}
.map-seq-acts{display:flex;gap:3px}
.map-seq-acts button{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-2);font-size:11px}
.map-seq-acts button:disabled{opacity:.35}
.map-seq-empty{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.45;color:var(--ink-3);padding:6px 2px}
.map-seq-empty svg{flex:none;margin-top:2px}
.map-seq-empty b{color:var(--ink-2);font-weight:700}
.map-side .map-seq-head{margin-bottom:8px}
.map-edge-from{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:11px;background:color-mix(in srgb,var(--vermilion) 8%,transparent);border:1px dashed color-mix(in srgb,var(--vermilion) 30%,transparent)}
.map-branch-kind{display:inline-flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.map-branch-kind[data-kind="sub"]{color:var(--vermilion)}
.map-branch-kind[data-kind="sweep"]{color:var(--indigo)}
.map-branch-kind[data-kind="pass"]{color:var(--gold)}
.map-branch-kind[data-kind="takedown"]{color:var(--moss)}
.map-branch-kind[data-kind="escape"]{color:var(--danger)}
.map-edge-from .map-branch-kind{color:var(--vermilion)}
.map-edge-from b{font-size:13px}

/* ---- paletas em Ajustes ---- */
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px;margin-top:12px}
.pal-opt{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:9px;border-radius:13px;border:1px solid var(--line);background:var(--card-2);text-align:left;transition:transform .18s var(--ease),border-color .18s}
.pal-opt:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--vermilion) 40%,var(--line))}
.pal-opt[aria-pressed="true"]{border-color:var(--vermilion);box-shadow:0 0 0 3px color-mix(in srgb,var(--vermilion) 14%,transparent)}
.pal-opt b{font-size:11.5px}

.badge--role{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;vertical-align:middle;font-weight:700}

/* ---------- segurança: tela de PIN ---------- */
/* ---------- menu de páginas na barra superior ---------- */
.menu-pop{
  position:fixed;z-index:95;min-width:214px;padding:7px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-l);backdrop-filter:blur(20px) saturate(1.4);
  animation:menuIn .16s var(--ease)
}
.menu-pop[hidden]{display:none}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu-pop a{
  display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s
}
.menu-pop button{
  display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;width:100%;text-align:left;
  font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s
}
.menu-pop button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.menu-pop button svg{opacity:.85;flex:none}
.menu-pop a:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.menu-pop a[aria-current="page"]{color:var(--vermilion);background:color-mix(in srgb,var(--vermilion) 10%,transparent)}
.menu-pop a svg{opacity:.85;flex:none}
.menu-pop .menu-sep{height:1px;background:var(--line-2);margin:6px 4px}
.demo-banner{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;align-items:center;gap:12px;
  justify-content:space-between;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--gold) 16%,var(--paper-deep));border-top:1px solid color-mix(in srgb,var(--gold) 34%,var(--line));
  font-size:11.5px;font-weight:600;color:var(--ink-2);backdrop-filter:blur(14px)}
.demo-banner[hidden]{display:none}
body.has-demo-banner .toasts{bottom:78px}
.demo-banner span{display:flex;align-items:center;gap:7px}
.demo-banner span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
body.has-demo-banner .main{padding-bottom:74px}
/* dentro da cortina .lock-screen o wrap é só um contêiner neutro */
.lock-screen .lock-wrap{display:block}
.lock-screen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
  background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--accent) 18%,var(--paper)),var(--paper) 70%);
  backdrop-filter:blur(6px)}
.lock-card{width:100%;max-width:330px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:26px 22px;box-shadow:var(--shadow-l)}
.lock-title{font-family:var(--serif);font-size:24px;font-weight:500;text-align:center;margin:4px 0 8px}
/* escolha do professor no login */
.quem-lista{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.quem{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);text-align:left;
  font-size:14px;font-weight:650;color:var(--ink-2);transition:.18s var(--ease)
}
.quem:hover{border-color:var(--ink-3);color:var(--ink)}
.quem[aria-selected="true"]{
  border-color:var(--vermilion);color:var(--ink);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--vermilion) 13%,transparent)
}
.quem-ini{
  width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--vermilion) 14%,transparent);color:var(--vermilion);
  font-family:var(--cond);font-size:14px;font-weight:800
}
.quem[aria-selected="true"] .quem-ini{background:var(--vermilion);color:#fff}
.lock-card .brand-seal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:var(--vermilion);color:#fff7f2;font-family:var(--serif);font-size:27px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 6px 18px -8px rgba(196,67,44,.8)}
.lock-input{text-align:center;font-size:24px;letter-spacing:.35em;padding:14px 10px;height:auto}
.lock-erro{min-height:18px;font-size:11.5px;color:var(--vermilion);text-align:center;margin-top:6px}
.sec-facts{display:grid;gap:9px;margin-top:10px}
.sec-facts>div{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--ink) 3%,transparent)}
.sec-facts b{display:block;font-size:12.5px;margin-bottom:2px}
.sec-facts span{font-size:11.5px;color:var(--ink-3);line-height:1.55}

/* ---------- ajustes: seções recolhíveis ---------- */
.page-ver{
  display:inline-flex;align-items:center;gap:6px;margin-top:7px;
  font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);padding:4px 9px;border-radius:999px;
  border:1px solid var(--line-2);background:color-mix(in srgb,var(--ink) 4%,transparent)
}
.set-sec{padding:0;overflow:hidden}
.set-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:17px 18px;
  background:transparent;border:0;cursor:pointer;font:inherit;color:inherit;transition:background .18s}
.set-head:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.set-titles{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.set-title{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:-.01em}
.set-sub{font-size:12px;color:var(--ink-3)}
.set-chev{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;
  color:var(--ink-3);transition:transform .22s var(--ease),background .18s,color .18s}
.set-head[aria-expanded="true"] .set-chev{transform:rotate(180deg);color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent)}
.set-body{border-top:1px solid var(--line-2);animation:setIn .24s var(--ease)}
.set-body[hidden]{display:none}
@keyframes setIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.set-pad{padding:0 18px 6px}
.set-pad> .settings-row:first-child{padding-top:14px}
.set-pad> .card-head,.set-pad> .sub,.set-pad> p{padding-left:0;padding-right:0}
.set-body .sub,.set-body p{max-width:100%}

/* ---------- celular: posição do FAB + instalar ---------- */
.fab-pos-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.fab-pos{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 6px 7px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.18s var(--ease)}
.fab-pos:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.fab-pos[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.fab-pos-box{position:relative;width:34px;height:24px;border-radius:6px;border:1px dashed var(--line);
  background:color-mix(in srgb,var(--ink) 4%,transparent)}
.fab-pos-box i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--vermilion);
  left:3px;right:auto;top:auto;bottom:3px;transition:.18s}
.fab-pos-box i[style*="right"]{left:auto;right:3px}
.fab-pos-box i[style*="top"]{bottom:auto;top:3px}
.fab-pos-lbl{font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-3);text-align:center;line-height:1.2}
.fab-pos[aria-pressed="true"] .fab-pos-lbl{color:var(--accent)}
.install-steps{font-size:11.5px;color:var(--ink-3);margin-top:9px;line-height:1.6}
.publish-card{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:14px;
  padding:13px 14px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.publish-txt{flex:1;min-width:230px}
.publish-txt h4{font-size:13px;font-weight:600;margin-bottom:5px}
.publish-txt p{font-size:11.5px;color:var(--ink-3);line-height:1.55}
.publish-url{margin-top:9px;font:500 11.5px/1.4 var(--mono);word-break:break-all;color:var(--ink-2);
  background:var(--card-2);border:1px solid var(--line-2);border-radius:9px;padding:7px 9px}
.install-steps svg{vertical-align:-2px;margin-right:4px}
@media(max-width:520px){.fab-pos-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- backup ativo (Ajustes → Dados) ---------- */
.base-active{border:1px solid var(--line-2);border-radius:16px;padding:13px 14px;margin-top:10px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%)}
.base-active-head{display:flex;align-items:center;gap:11px;min-width:0}
.base-ico{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;flex:none;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.base-file{font:600 13px/1.25 var(--ui,inherit);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:330px}
.base-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.base-grid>div{display:flex;flex-direction:column;gap:1px}
.base-grid span{font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.base-grid b{font-family:var(--serif);font-size:17px;font-weight:500}
.base-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
@media(max-width:520px){.base-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.base-file{max-width:180px}}

/* ---------- histórico financeiro do aluno ---------- */
.identity--link{display:flex;align-items:center;gap:10px;padding:0;border:0;background:transparent;
  width:100%;cursor:pointer;border-radius:10px;transition:background .16s}
.identity--link:hover{background:color-mix(in srgb,var(--vermilion) 7%,transparent)}
.identity--link:hover b{color:var(--vermilion-ink);text-decoration:underline;text-underline-offset:2px}
/* linha de mensalidade clicável na ficha do aluno */
.row--link{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-2);text-align:left;
  font:inherit;color:inherit;cursor:pointer;padding:9px 8px;margin:0 -8px;border-radius:10px;transition:background .16s}
.row--link:last-child{border-bottom:0}
.row--link:hover{background:color-mix(in srgb,var(--vermilion) 8%,transparent)}
.row--link svg{color:var(--ink-3);flex:none}
.row--link:hover svg{color:var(--vermilion-ink)}
/* avatar e nome do histórico financeiro levam à ficha */
.avatar--btn{padding:0;border:0;cursor:pointer;font:inherit;transition:transform .16s,box-shadow .16s}
.avatar--btn:hover{transform:scale(1.06);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.fh-name{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:0;font:inherit;
  color:inherit;cursor:pointer;text-align:left}
.fh-name svg{opacity:.45;transition:opacity .16s,transform .16s}
.fh-name:hover{color:var(--vermilion-ink)}
.fh-name:hover svg{opacity:1;transform:translate(1px,-1px)}
.fh-to-profile{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:3px 7px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line-2);background:color-mix(in srgb,var(--paper) 45%,transparent);color:var(--ink-2);transition:.16s}
.fh-to-profile:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fh-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:14px}
.fh-kpi{display:flex;flex-direction:column;gap:1px;padding:11px 12px;border-radius:13px;
  border:1px solid var(--line-2);background:color-mix(in srgb,var(--paper) 50%,transparent)}
.fh-kpi span{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fh-kpi b{font-family:var(--serif);font-size:20px;letter-spacing:-.02em}
.fh-kpi small{font-size:10.5px;color:var(--ink-3)}
.fh-kpi.ok b{color:var(--moss)}
.fh-kpi.warn b{color:var(--vermilion-ink)}
.fh-alert{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:12px;font-size:12px;
  background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--ink);
  border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);margin-bottom:14px}
.fh-alert--late{background:color-mix(in srgb,var(--vermilion) 12%,transparent);
  border-color:color-mix(in srgb,var(--vermilion) 32%,transparent)}
.fh-alert--ok{background:color-mix(in srgb,var(--moss) 12%,transparent);
  border-color:color-mix(in srgb,var(--moss) 30%,transparent)}
.fh-alert .btn{margin-left:auto;flex:none}
.fh-year{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.fh-year-row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3)}
.fh-year-row span{width:34px;font-variant-numeric:tabular-nums}
.fh-year-row b{width:74px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.fh-track{flex:1;height:7px;border-radius:99px;background:var(--line-2);overflow:hidden}
.fh-track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--vermilion) 70%,transparent),color-mix(in srgb,var(--indigo) 65%,transparent))}
.fh-title{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:9px}
.fh-title svg{color:var(--vermilion)}
.fh-title .small{font-weight:600;letter-spacing:0;text-transform:none}
.fh-list{display:flex;flex-direction:column;gap:4px}
.fh-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;
  border:1px solid var(--line-2);background:color-mix(in srgb,var(--paper) 45%,transparent)}
.fh-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.fh-dot.ok{background:var(--moss)}
.fh-dot.warn{background:var(--gold)}
.fh-dot.late{background:var(--vermilion)}
.fh-month{display:flex;flex-direction:column;min-width:0;flex:1}
.fh-month b{font-size:12.5px;font-weight:650}
.fh-month small{font-size:10px;color:var(--ink-3)}
.fh-status{flex:none;text-align:right;max-width:130px}

.fh-act{width:30px}

  .fh-kpis{grid-template-columns:1fr 1fr}

}

/* extrato: ações e prazo */
.fh-acts{display:flex;align-items:center;gap:5px;flex:none}
.fh-days{display:block;font-size:9.5px;color:var(--ink-3);margin-top:2px}
.fh-status>.badge+.fh-days{margin-top:3px}
.fh-row{align-items:center}
/* formulário de edição da mensalidade */
.pe-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;
  border:1px solid var(--line-2);background:color-mix(in srgb,var(--paper) 45%,transparent)}
.pe-head b{font-size:13.5px;display:block}
.pe-head small{font-size:11px;color:var(--ink-3)}
.pe-head>.badge{margin-left:auto}
.pe-confirm{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:13px;

  transition:background .18s,border-color .18s}

.pe-confirm.is-on .pe-check{background:var(--moss);border-color:var(--moss);color:#fff}

  transition:transform .16s var(--spring),background .18s}

.mini-btn.wa-mini{color:var(--moss);border-color:color-mix(in srgb,var(--moss) 34%,var(--line));
  background:color-mix(in srgb,var(--moss) 12%,transparent)}
.mini-btn.wa-mini:hover{background:var(--moss);color:#fff;border-color:var(--moss)}
.mini-acts{display:flex;align-items:center;gap:5px}
.wa-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  border:1px solid var(--line-2);background:color-mix(in srgb,var(--paper) 45%,transparent);margin-bottom:7px}
.wa-list{display:flex;flex-direction:column}
.wa-status{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border-radius:13px;font-size:12px}
.wa-status b{display:block;font-size:12.5px}
.wa-status small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.wa-status.on{background:color-mix(in srgb,var(--moss) 13%,transparent);color:var(--moss);
  border:1px solid color-mix(in srgb,var(--moss) 30%,transparent)}
.wa-status.off{background:color-mix(in srgb,var(--gold) 13%,transparent);color:var(--gold-ink,var(--gold));
  border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.wa-status b,.wa-status small{color:var(--ink)}
.wa-help{font-size:11.5px;line-height:1.6;color:var(--ink-2);padding:10px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line-2)}
.wa-center{font-size:12px}
.wa-emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wa-emoji{min-width:44px;justify-content:center;font-size:15px;line-height:1.2}
.wa-emoji[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wa-emoji.is-missing{opacity:.45;text-decoration:line-through}
.wa-emoji.is-missing::after{content:" !";text-decoration:none;font-size:10px;color:var(--vermilion)}
.wa-preview{white-space:pre-wrap;font-family:var(--ui,inherit);font-size:12px;line-height:1.6;color:var(--ink-2);
  margin:0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,#0b6b4f 10%,transparent);
  border:1px solid var(--line-2);max-height:240px;overflow:auto}

/* ---------- relatórios gerenciais ---------- */
.rd-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.rd-head h3{font:600 17px/1.2 var(--sans);letter-spacing:-.02em}
.rd-head .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.rd-head .btn{margin-left:auto}
.rd-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.rd-kpi .value{font-size:23px}
.rd-grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:14px}
.rd-grid-1{margin-bottom:6px}
.rd-trend{font:700 11px var(--sans);padding:3px 8px;border-radius:999px}
.rd-trend.up{color:var(--moss);background:var(--moss-soft)}
.rd-trend.down{color:var(--vermilion-ink);background:var(--vermilion-soft)}

/* caixa */
.rd-cash{display:flex;align-items:flex-end;gap:10px;height:148px;padding-top:6px}
.rd-cash-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.rd-cash-bars{display:flex;align-items:flex-end;gap:3px;height:104px;width:100%;justify-content:center}
.rd-cash-bars i{width:12px;border-radius:4px 4px 2px 2px;min-height:3px;transition:height .4s var(--ease)}
.rd-cash-bars i.rev{background:linear-gradient(180deg,color-mix(in srgb,var(--moss) 80%,transparent),color-mix(in srgb,var(--moss) 40%,transparent))}
.rd-cash-bars i.exp{background:linear-gradient(180deg,color-mix(in srgb,var(--vermilion) 72%,transparent),color-mix(in srgb,var(--vermilion) 32%,transparent))}
.rd-cash-col b{font-size:10px;color:var(--ink-2);text-transform:capitalize}
.rd-cash-col small{font-size:9px;font-weight:700}
.rd-cash-col small.pos{color:var(--moss)}
.rd-cash-col small.neg{color:var(--vermilion-ink)}
.rd-legend{display:flex;align-items:center;gap:12px;font-size:10px;color:var(--ink-3);margin-top:6px}
.rd-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.rd-legend i.rev{background:var(--moss)}
.rd-legend i.exp{background:var(--vermilion)}
.rd-legend-tip{margin-left:auto}
.rd-note{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.rd-note b{color:var(--ink)}
.rd-note .lnk{font-size:11px}

/* ocupação */
.rd-ring-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rd-ring{position:relative;width:104px;height:104px;flex:none}
.rd-ring svg{transform:rotate(-90deg)}
.rd-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.rd-ring .track{stroke:var(--line)}
.rd-ring .val{stroke:var(--vermilion);transition:stroke-dasharray .6s var(--ease)}
.rd-ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.rd-ring-txt b{font:700 20px/1 var(--sans)}
.rd-ring-txt small{font-size:8.5px;color:var(--ink-3);text-align:center;max-width:74px}
.rd-ring-side{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px}
.rd-mini{display:grid;grid-template-columns:1fr auto;gap:1px 8px;align-items:baseline}
.rd-mini span{font-size:11.5px;font-weight:600}
.rd-mini b{font-size:12.5px;color:var(--vermilion-ink)}
.rd-mini small{grid-column:1/-1;font-size:9.5px;color:var(--ink-3)}
.rd-mini-track{grid-column:1/-1;height:4px;border-radius:99px;background:var(--line-2);overflow:hidden}
.rd-mini-track i{display:block;height:100%;border-radius:99px;background:color-mix(in srgb,var(--vermilion) 62%,var(--indigo))}
.rd-sub-title{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700;margin:14px 0 6px}
.rd-spark{display:flex;align-items:flex-end;gap:6px;height:64px}
.rd-spark-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.rd-spark-col b{font-size:9.5px;color:var(--ink-2)}
.rd-spark-col i{width:100%;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--indigo) 55%,transparent);transition:height .4s var(--ease)}
.rd-spark-col small{font-size:8.5px;color:var(--ink-3)}

/* faixas */
.rd-belts{display:flex;flex-direction:column;gap:7px}
.rd-belt{display:flex;align-items:center;gap:8px}
.rd-belt i{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.rd-belt span{font-size:11.5px;width:58px;flex:none}
.rd-belt-track{flex:1;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.rd-belt-track b{display:block;height:100%;border-radius:99px;background:color-mix(in srgb,var(--gold) 70%,var(--vermilion))}
.rd-belt b.num{font-size:11.5px;width:22px;text-align:right}
.rd-alert{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;padding:9px 11px;border-radius:11px;
  font-size:11.5px;color:var(--vermilion-ink);background:var(--vermilion-soft);border:1px solid color-mix(in srgb,var(--vermilion) 26%,transparent)}
.rd-alert--soft{color:var(--gold);background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 28%,transparent)}
.rd-alert .lnk{color:inherit;text-decoration:underline;font-size:11.5px}

/* assiduidade */
.rd-rank{display:flex;flex-direction:column;gap:2px}
.rd-rank-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;text-align:left}
.rd-rank-row:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.rd-rank-n{font:600 9.5px var(--mono);color:var(--ink-3);width:16px}
.rd-rank-name{font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-rank-track{width:70px;height:5px;border-radius:99px;background:var(--line-2);overflow:hidden;flex:none}
.rd-rank-track i{display:block;height:100%;border-radius:99px;background:color-mix(in srgb,var(--moss) 75%,var(--indigo))}
.rd-rank-row b.num{font-size:11px;width:18px;text-align:right}

/* cobrança */
.rd-debts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.rd-debt{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;text-align:left;
  border:1px solid var(--line-2);background:color-mix(in srgb,var(--paper) 45%,transparent)}
.rd-debt:hover{border-color:color-mix(in srgb,var(--vermilion) 40%,var(--line))}
.rd-debt-days{font:700 9px/1 var(--sans);padding:4px 6px;border-radius:6px;background:var(--line-2);color:var(--ink-2);flex:none;text-transform:uppercase;letter-spacing:.04em}
.rd-debt-days.warn{background:var(--gold-soft);color:var(--gold)}
.rd-debt-days.late{background:var(--vermilion-soft);color:var(--vermilion-ink)}
.rd-debt-name{flex:1;min-width:0;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-debt-go{color:var(--ink-3)}

@media(max-width:900px){
  .rd-kpis{grid-template-columns:1fr 1fr}
  .rd-grid-2{grid-template-columns:1fr}
  .rd-kpi .value{font-size:20px}
  .rd-cash{height:126px}
  .rd-cash-bars{height:88px}
  .rd-cash-bars i{width:9px}
}
@media(max-width:420px){.rd-kpis{grid-template-columns:1fr}}

.pal-opt small{font-size:10px;color:var(--ink-3)}
.pal-glass{position:relative;width:100%;height:42px;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;gap:3px;padding:6px;background:linear-gradient(140deg,var(--p1),color-mix(in srgb,var(--p2) 65%,transparent))}
.pal-glass i{flex:1;border-radius:4px;background:color-mix(in srgb,#fff 55%,var(--p2))}
.pal-glass i:nth-child(2){flex:1.6;background:color-mix(in srgb,#fff 78%,transparent);height:60%}
.pal-glass i:nth-child(3){background:var(--p3);height:34%}
.pal-on{position:absolute;right:7px;bottom:44px;width:18px;height:18px;border-radius:50%;background:var(--vermilion);color:#fff;display:grid;place-items:center}

  .map-mobile-list{display:flex;flex-direction:column;gap:7px}
  .map-mobile-head{font-size:12px;font-weight:700;color:var(--ink-2);padding:2px 2px 4px}
  .map-m-row{display:flex;align-items:stretch;gap:8px}
  .map-m-go{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
  .map-m-go b{font-size:12.5px}
  .map-m-go small{font-size:10.5px;color:var(--ink-3)}
  .map-add--inline{align-self:center}
  .map-legend{display:none}
  .map-page-body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  body.map-open .dock{display:none}
  .map-grid{grid-template-columns:1fr 1fr}
  .pal-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  .map-grid{grid-template-columns:1fr}
  .map-page-title h1{font-size:15px}
}

/* painel de conexão dentro da página do mapa */
.map-sheet-host{position:fixed;inset:0;z-index:150;display:none}
.map-sheet-host.show{display:block}
.map-sheet-scrim{position:absolute;inset:0;background:rgba(4,5,12,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.map-sheet{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(460px,calc(100% - 24px));max-height:86vh;overflow:auto;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--card) 90%,var(--paper));border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-l);animation:sheetIn .28s var(--ease)
}
@keyframes sheetIn{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.map-sheet-head{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.map-sheet-head h2{font:600 17px/1.2 var(--sans);letter-spacing:-.02em}
.map-sheet-body{padding:14px 18px}
.map-sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
@media(max-width:600px){
  .map-sheet{top:auto;bottom:0;left:0;transform:none;width:100%;border-radius:18px 18px 0 0;max-height:88vh}
  @keyframes sheetIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
}
@media(prefers-reduced-motion:reduce){.map-page.show{animation:none}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ---------- desempenho: celulares simples ---------- */
/* telas de toque, pouca memória ou conexão econômica: desliga o desfoque de vidro
   (o visual translúcido continua) e reduz animações contínuas. */
@media (max-width:900px), (update:slow), (prefers-reduced-data:reduce){
  .card,.modal,.drawer,.cmdk,.dock,.topbar{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
  .card{background:color-mix(in srgb,var(--card) 94%,var(--paper))}
  .modal,.drawer,.cmdk{background:color-mix(in srgb,var(--paper) 96%,transparent)}
  .dock{background:color-mix(in srgb,var(--paper) 94%,transparent)}
  .topbar{background:color-mix(in srgb,var(--paper) 94%,transparent)}
  body::before{display:none}
  body{background-attachment:scroll}
  .enso,.hero::before{display:none}
  .view-anim>*{animation:none !important}
  .ticker-track{animation-duration:60s}
  .hero-ticker::after{display:none}
}
html.lowfx .card,html.lowfx .modal,html.lowfx .drawer,html.lowfx .cmdk,html.lowfx .dock,html.lowfx .topbar{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
html.lowfx .dock{background:var(--paper-deep);box-shadow:0 -10px 30px -18px rgba(0,0,0,.9)}
html.lowfx body::before{display:none}
html.lowfx .enso,html.lowfx .hero::before{display:none}
html.lowfx .view-anim>*{animation:none !important}

/* impressão */
@media print{
  .topbar,.dock,.page-actions,.td-actions,.toasts{display:none !important}
  .card{box-shadow:none;break-inside:avoid}
  body::before{display:none}
}
</style>
</head>
<body>

</div>

</div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"></aside>

    <button class="map-close" type="button" id="mapClose" aria-label="Voltar ao treino"></button>
    <div class="map-page-title"><div class="eyebrow">Currículo do dojo</div><h1>Mapa mental</h1></div>

  <div class="map-page-body"><div id="mapHost"></div></div>

</div>

    <input id="cmdkInput" type="text" placeholder="Buscar aluno, página ou ação…" autocomplete="off" spellcheck="false" aria-controls="cmdkList" aria-expanded="true">
    <div class="cmdk-list" id="cmdkList" role="listbox" aria-label="Resultados"></div>
    <div class="cmdk-foot">
      <span><b>↑↓</b> navegar</span><span><b>↵</b> abrir</span><span><b>esc</b> fechar</span>
    </div>
  </div>
</div>

<div class="chart-tip" id="chartTip" role="status"></div>

<script>
/* ============================================================
   1. DADOS
   ============================================================ */
const KEY = 'arandu-dojo-data';
const BASE_KEY = 'arandu-dojo-base';
const PREF_KEY = 'arandu-theme';
const COL_KEY = 'arandu-v2-prefs';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => new Date(s + 'T12:00:00');
const TODAY = new Date();
const TODAY_ISO = iso(TODAY);

/* ============================================================
   BASE REAL DO DOJO (dados iniciais)
   Backup importado em 24/11/2026 — é a base que abre no primeiro acesso
   e o "restaurar base inicial" em Ajustes.
   ============================================================ */

function monthShift(m, n) {

const paymentsOf = m => db.payments.filter(p => p.month === m);
const expensesOf = m => db.expenses.filter(e => (e.date || '').startsWith(m));
const dueFor = (s, m) => `${m}-${pad(Math.min(Number(s.dueDay) || 10, 28))}`;
const studentById = id => db.students.find(s => s.id === id);
const paymentById = id => db.payments.find(p => p.id === id);
const trainingById = id => db.trainings.find(t => t.id === id);
const expenseById = id => db.expenses.find(e => e.id === id);
const visitorById = id => db.visitors.find(v => v.id === id);

function studentDates(id) {
  return Object.keys(db.attendance).filter(d => (db.attendance[d] || []).includes(id)).sort();
}
function freqCount(id, period) {
  const dates = studentDates(id);
  if (period === 'week') { const s = weekStart(TODAY_ISO); return dates.filter(d => d >= s && d <= addDays(s, 6)).length; }
  if (period === 'month') return dates.filter(d => d.startsWith(MONTH)).length;
  if (period === 'year') return dates.filter(d => d.startsWith(TODAY_ISO.slice(0, 4))).length;
  return dates.length;
}
function ensureMonthly(month) {
  let added = 0;
  activeStudents().forEach(s => {
    if (!db.payments.some(p => p.studentId === s.id && p.month === month)) {
      db.payments.push({ id: uid(), studentId: s.id, month, dueDate: dueFor(s, month), amount: Number(s.fee) || 0, status: 'Pendente', paidAt: '', method: '' });
      added++;
    }
  });
  return added;
}
const degreeOf = s => { const n = Number(s.degrees); return Number.isInteger(n) && n >= 0 && n <= 4 ? n : 0; };
const beltText = s => `${s.belt || '—'}${degreeOf(s) ? ' ' + degreeOf(s) : ''}`;

function greeting() {
  const h = new Date().getHours();
  if (h < 6) return 'Boa madrugada';
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}
function todayLong() {
  return `${WEEKDAYS_LONG[TODAY.getDay()]}, ${TODAY.getDate()} de ${MONTHS[TODAY.getMonth()]} de ${TODAY.getFullYear()}`;
}

let toastTimers = [];
function toast(msg, opts = {}) {
  const host = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="bar"></span>
    ${opts.icon ? `<span style="display:grid;place-items:center;opacity:.85">${icon(opts.icon, 16)}</span>` : ''}
    <span style="flex:1">${esc(msg)}</span>
    ${opts.action ? `<button class="act" type="button">${esc(opts.action)}</button>` : ''}
    <button class="x" type="button" aria-label="Fechar">${icon('x', 14)}</button>`;
  host.appendChild(el);
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 320); };
  const t = setTimeout(close, 4200);
  toastTimers.push(t);
  el.querySelector('.x').onclick = () => { clearTimeout(t); close(); };
  if (opts.action) el.querySelector('.act').onclick = () => { clearTimeout(t); close(); opts.onAction && opts.onAction(); };
  return el;
}

function confirmDialog({ title = 'Confirmar ação', message = '', confirmText = 'Confirmar', cancelText = 'Cancelar', danger = false }) {
  return new Promise(resolve => {
    const wrap = $('#modalWrap');
    wrap.innerHTML = `<div class="modal modal--sm ${danger ? 'danger' : ''}" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
      <div class="modal-body">
        <div class="confirm-icon">${danger ? '!' : '?'}</div>
        <h3 id="cfTitle" class="serif" style="font-family:var(--serif);font-size:22px;margin-bottom:8px">${esc(title)}</h3>
        <p class="muted small" style="font-size:13.5px;white-space:pre-line">${esc(message)}</p>
        <div class="confirm-actions">
          <button class="btn btn--ghost" data-act="cancel">${esc(cancelText)}</button>
          <button class="btn ${danger ? 'btn--danger' : 'btn--primary'}" data-act="ok">${esc(confirmText)}</button>
        </div>
      </div></div>`;
    wrap.classList.add('show');
    wrap.setAttribute('aria-hidden', 'false');
    $('#scrim').classList.add('show');
    const done = val => { wrap.classList.remove('show'); wrap.setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('show'); wrap.innerHTML = ''; resolve(val); };
    $$('[data-act]', wrap).forEach(b => b.onclick = () => done(b.dataset.act === 'ok'));
    wrap.onclick = e => { if (e.target === wrap) done(false); };
    setTimeout(() => $('#modalWrap [data-act="ok"]')?.focus(), 60);
    document.addEventListener('keydown', function onKey(e) {
      if (!wrap.classList.contains('show')) { document.removeEventListener('keydown', onKey); return; }
      if (e.key === 'Escape') { document.removeEventListener('keydown', onKey); done(false); }
    });
  });
}

let modalCloseHandler = null;
function openModal({ title, eyebrow = 'Dojo Arandu', body, onSubmit, submitText = 'Salvar', wide = false, onMount, hideCancel = false }) {
  const wrap = $('#modalWrap');
  wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" ${wide ? 'style="width:min(820px,100%)"' : ''}>
    <form id="modalForm" novalidate>
      <div class="modal-head">
        <div>
          <div class="eyebrow">${esc(eyebrow)}</div>
          <h2 id="mTitle">${esc(title)}</h2>
        </div>
        <button class="close-x" type="button" data-close aria-label="Fechar">${icon('x', 17)}</button>
      </div>
      <div class="modal-body" id="modalBody">${body}</div>
      <div class="modal-foot">
        ${hideCancel ? '' : `<button class="btn btn--ghost" type="button" data-close>${submitText ? 'Cancelar' : 'Fechar'}</button>`}
        ${submitText ? `<button class="btn btn--primary" type="submit">${icon('check', 15)} ${esc(submitText)}</button>` : ''}
      </div>
    </form></div>`;
  wrap.classList.add('show');
  wrap.setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('show');
  const close = () => { wrap.classList.remove('show'); wrap.setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('show'); wrap.innerHTML = ''; modalCloseHandler = null; };
  modalCloseHandler = close;
  $$('[data-close]', wrap).forEach(b => b.onclick = close);
  wrap.onclick = e => { if (e.target === wrap) close(); };
  $('#modalForm', wrap).onsubmit = e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    const result = onSubmit ? onSubmit(data, e.target) : true;
    if (result !== false) close();
  };
  if (onMount) onMount(wrap);
  setTimeout(() => {
    const first = wrap.querySelector('input:not([type=hidden]),select,textarea');
    if (first) first.focus();
  }, 80);
  return { close, el: wrap };
}

/* campos */
function fieldHTML(f) {
  const id = 'f_' + f.name;
  const lab = `<label class="lbl" for="${id}">${esc(f.label)}${f.required ? ' <span style="color:var(--vermilion)">*</span>' : ''}</label>`;
  let input;
  if (f.type === 'select') {
    input = `<select class="field" id="${id}" name="${f.name}" ${f.required ? 'required' : ''}>${(f.options || []).map(o => {
      const val = typeof o === 'string' ? o : o.value, txt = typeof o === 'string' ? o : o.label;
      return `<option value="${esc(val)}" ${String(f.value) === String(val) ? 'selected' : ''}>${esc(txt)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea class="field" id="${id}" name="${f.name}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder || '')}">${esc(f.value ?? '')}</textarea>`;
  } else if (f.type === 'belt') {
    const cur = f.value || 'Branca';
    input = `<input type="hidden" name="${f.name}" id="${id}" value="${esc(cur)}">
      <div class="belt-picker" style="display:flex;flex-wrap:wrap;gap:6px" role="group" aria-label="Faixa">
        ${BELTS.map(([name, color]) => `<button type="button" class="chip" data-belt="${name}" aria-pressed="${cur === name}" style="padding:6px 10px">
          <i class="belt-bar" style="width:22px;height:10px;background:${color};box-shadow:inset 0 -1px 2px rgba(0,0,0,.25)"></i>${name}</button>`).join('')}
      </div>`;
  } else if (f.type === 'degrees') {
    input = `<input type="hidden" name="${f.name}" id="${id}" value="${f.value ?? 0}">
      <div style="display:flex;gap:6px">${[0, 1, 2, 3, 4].map(n => `<button type="button" class="chip" data-degree="${n}" aria-pressed="${Number(f.value ?? 0) === n}" style="min-width:44px;justify-content:center">${n === 0 ? '—' : n + 'º'}</button>`).join('')}</div>`;
  } else {
    input = `<input class="field" id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}"
      ${f.required ? 'required' : ''} ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}
      ${f.step ? `step="${f.step}"` : ''} placeholder="${esc(f.placeholder || '')}" ${f.inputmode ? `inputmode="${f.inputmode}"` : ''}>`;
  }
  return `<div class="form-field ${f.full ? 'full' : ''}" ${f.hidden ? 'hidden' : ''} ${f.id ? `id="${f.id}"` : ''}>
    ${lab}${input}${f.hint ? `<div class="field-note">${esc(f.hint)}</div>` : ''}</div>`;
}
/* faixa: só mostra as faixas da turma escolhida */
function mountClassBeltGroup(root) {
  const sel = root.querySelector('#f_classGroup');
  const group = root.querySelector('.belt-picker');
  if (!sel || !group) return;
  const hidden = group.parentElement.querySelector('input[type=hidden]');
  const sync = () => {
    const allowed = BELTS_BY_GROUP[sel.value] || BELTS_BY_GROUP.Adulto;
    $$('[data-belt]', group).forEach(b => { b.hidden = !allowed.includes(b.dataset.belt); });
    if (!allowed.includes(hidden.value)) {
      hidden.value = allowed[0];
      $$('[data-belt]', group).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.belt === allowed[0])));
    }
  };
  sel.addEventListener('change', sync);
  /* acompanha a escolha de faixa para não invalidar depois */
  $$('[data-belt]', group).forEach(b => b.addEventListener('click', () => { hidden.value = b.dataset.belt; }));
  sync();
}

/* mensalidade: padrão ou valor livre */
function mountFeeMode(root) {
  const hidden = root.querySelector('#f_feeMode');
  const wrap = root.querySelector('#feeCustomWrap');
  const input = root.querySelector('#f_fee');
  const preview = root.querySelector('#feePreview');
  if (!hidden || !wrap || !input) return;
  const syncPreview = () => {
    if (hidden.value !== 'outro') { preview.innerHTML = `Cobrança padrão do dojo: <b>${money(FEE_DEFAULT)}</b> por mês.`; return; }
    const v = Number(input.value) || 0;
    preview.innerHTML = v > 0 ? `Cobrança personalizada: <b>${money(v)}</b> por mês.` : 'Digite o valor combinado com o aluno.';
  };
  $$('[data-fee-mode]', root).forEach(btn => btn.onclick = () => {
    hidden.value = btn.dataset.feeMode;
    $$('[data-fee-mode]', root).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    wrap.style.display = btn.dataset.feeMode === 'outro' ? 'flex' : 'none';
    if (btn.dataset.feeMode === 'outro') { if (!input.value) input.value = ''; input.focus(); }
    else input.removeAttribute('required');
    syncPreview();
  });
  input.addEventListener('input', syncPreview);
  syncPreview();
}

function mountBeltPicker(root) {
  $$('.belt-picker', root).forEach(group => {
    const hidden = group.parentElement.querySelector('input[type=hidden]');
    $$('[data-belt]', group).forEach(btn => btn.onclick = () => {
      hidden.value = btn.dataset.belt;
      $$('[data-belt]', group).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    });
  });
  $$('[data-degree]', root).forEach(btn => btn.onclick = () => {
    const hidden = btn.closest('.form-field').querySelector('input[type=hidden]');
    hidden.value = btn.dataset.degree;
    $$('[data-degree]', btn.parentElement).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  });
}

  const color = beltColor(s.belt);

/* ----- contadores animados ----- */
function animateNumbers(root = document) {
  $$('[data-count]', root).forEach(el => {
    const target = Number(el.dataset.count);
    const isMoney = el.dataset.money === '1';
    const decimals = Number(el.dataset.decimals || 0);
    const dur = 900;
    const start = performance.now();
    const fmt = v => isMoney ? v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 })
      : v.toLocaleString('pt-BR', { maximumFractionDigits: decimals });
    const tick = now => {
      const p = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(target * eased);
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = fmt(target);
    };
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) el.textContent = fmt(target);
    else requestAnimationFrame(tick);
  });
}

/* ============================================================
   7. GRÁFICOS (SVG artesanal)
   ============================================================ */
const CHART = { w: 620, h: 180, l: 38, r: 12, t: 14, b: 26 };

const hasData = arr => arr.some(v => Number.isFinite(v) && v > 0);
function chartEmpty(msg, hint) {
  return `<div class="empty" style="padding:30px 16px"><span class="ico">${icon('chart', 18)}</span><b>${esc(msg)}</b>${hint ? `<small>${esc(hint)}</small>` : ''}</div>`;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return m * p;
}

function groupedBars({ labels, series, max, format = v => v, highlight = -1, height = 168, unit = '' }) {
  const { w, l, r, t, b } = { ...CHART, h: height };
  const plotW = w - l - r, plotH = height - t - b;
  const top = niceMax(max || Math.max(1, ...series.flatMap(s => s.values.filter(Number.isFinite))));
  const slot = plotW / labels.length;
  const barW = Math.min(18, (slot - 10) / series.length);
  const groupW = barW * series.length + 2 * (series.length - 1);
  let svg = `<svg class="chart" viewBox="0 0 ${w} ${height}" role="img" aria-label="Gráfico de barras">`;
  /* grade */
  [0, .25, .5, .75, 1].forEach(f => {
    const y = t + plotH * (1 - f);
    svg += `<line class="grid-line" x1="${l}" y1="${y.toFixed(1)}" x2="${w - r}" y2="${y.toFixed(1)}" ${f === 0 ? '' : 'stroke-dasharray="2 5"'}/>`;
    svg += `<text class="axis" x="${l - 9}" y="${(y + 3).toFixed(1)}" text-anchor="end">${format(top * f)}</text>`;
  });
  labels.forEach((lab, i) => {
    const cx = l + slot * i + slot / 2;
    if (i === highlight) svg += `<rect x="${(l + slot * i + 1).toFixed(1)}" y="${t - 6}" width="${(slot - 2).toFixed(1)}" height="${plotH + 6}" rx="7" fill="color-mix(in srgb,var(--vermilion) 7%,transparent)"/>`;
    series.forEach((s, si) => {
      const v = s.values[i];
      if (!Number.isFinite(v)) return;
      const h = Math.max(v > 0 ? 3 : 0, (v / top) * plotH);
      const x = cx - groupW / 2 + si * (barW + 2);
      const y = t + plotH - h;
      svg += `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5, barW / 2).toFixed(1)}" fill="${s.color}" data-tip="${esc(lab + (s.name ? ' · ' + s.name : '') + '\n' + format(v) + unit)}" style="transform-origin:${(x + barW / 2).toFixed(1)}px ${(t + plotH).toFixed(1)}px;animation:growY .55s ${i * 26 + si * 40}ms var(--ease) both"/>`;
    });
    svg += `<text class="axis" x="${cx.toFixed(1)}" y="${height - 8}" text-anchor="middle" ${i === highlight ? 'fill="var(--vermilion)" font-weight="700"' : ''}>${esc(lab)}</text>`;
  });
  svg += `<line x1="${l}" y1="${t + plotH}" x2="${w - r}" y2="${t + plotH}" stroke="var(--line)" stroke-width="1"/>`;
  return svg + '</svg>';
}

function smoothPath(points) {
  if (!points.length) return '';
  if (points.length === 1) return `M${points[0][0]},${points[0][1]}`;
  let d = `M${points[0][0]},${points[0][1]}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i - 1] || points[i], p1 = points[i], p2 = points[i + 1], p3 = points[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function lineChart({ labels, series, max, height = 210, format = v => v, highlight = -1, yFormat, ticks = 4, unit = '', xLabelEvery = 1 }) {
  const w = CHART.w, l = 40, r = 22, t = 16, b = 26;
  const plotW = w - l - r, plotH = height - t - b;
  const all = series.filter(s => !s.secondaryMax).flatMap(s => s.values.filter(Number.isFinite));
  const top = niceMax(max || Math.max(1, ...all));
  const x = i => l + (labels.length === 1 ? plotW / 2 : (plotW * i) / (labels.length - 1));
  const y = v => t + plotH - Math.min(1, Math.max(0, v) / top) * plotH;
  const yOf = (s, v) => s.secondaryMax ? t + plotH - Math.min(1, Math.max(0, v) / s.secondaryMax) * plotH * 0.45 : y(v);
  let svg = `<svg class="chart" viewBox="0 0 ${w} ${height}" role="img" aria-label="Gráfico de linhas">`;
  svg += `<defs>${series.map((s, si) => `<linearGradient id="grad${si}-${s.uid || ''}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.color}" stop-opacity=".26"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0"/>
    </linearGradient>`).join('')}</defs>`;
  for (let i = 0; i <= ticks; i++) {
    const gy = t + (plotH * i) / ticks;
    svg += `<line class="grid-line" x1="${l}" y1="${gy.toFixed(1)}" x2="${w - r}" y2="${gy.toFixed(1)}" ${i === ticks ? '' : 'stroke-dasharray="2 5"'}/>`;
    svg += `<text class="axis" x="${l - 9}" y="${(gy + 3).toFixed(1)}" text-anchor="end">${(yFormat || format)(top - (top * i) / ticks)}</text>`;
  }
  if (highlight >= 0) {
    svg += `<line x1="${x(highlight).toFixed(1)}" y1="${t}" x2="${x(highlight).toFixed(1)}" y2="${t + plotH}" stroke="var(--vermilion)" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>`;
  }
  /* áreas + linhas */
  series.forEach((s, si) => {
    const segs = [];
    let cur = [];
    s.values.forEach((v, i) => {
      if (Number.isFinite(v)) cur.push([x(i), yOf(s, v), i]);
      else if (!s.connect) { if (cur.length) segs.push(cur); cur = []; }
    });
    if (cur.length) segs.push(cur);
    segs.forEach(seg => {
      const d = smoothPath(seg.map(p => [p[0], p[1]]));
      if (s.fill !== false && !s.secondaryMax && seg.length > 1) {
        const areaD = `${d} L${seg[seg.length - 1][0].toFixed(1)},${(t + plotH).toFixed(1)} L${seg[0][0].toFixed(1)},${(t + plotH).toFixed(1)} Z`;
        svg += `<path class="area" d="${areaD}" fill="url(#grad${si}-${s.uid || ''})" opacity="0" style="animation:fadeIn .8s ${400 + si * 120}ms var(--ease) forwards"/>`;
      }
      svg += `<path class="line-path" d="${d}" stroke="${s.color}" pathLength="1"
        style="stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.1s ${si * 120}ms var(--ease) forwards"/>`;
      if (seg.length > 1) seg.forEach(([px, py, i]) => {
        svg += `<circle class="pt" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.6" fill="var(--card)" stroke="${s.color}" stroke-width="1.8"
          data-tip="${esc((s.name ? s.name + ' · ' : '') + (s.pointLabels ? s.pointLabels[i] : labels[i]) + '\n' + format(s.values[i]) + unit)}"/>`;
      });
    });
  });
  labels.forEach((lab, i) => {
    if (i % xLabelEvery !== 0 && i !== labels.length - 1) return;
    svg += `<text class="axis" x="${x(i).toFixed(1)}" y="${height - 8}" text-anchor="middle" ${i === highlight ? 'fill="var(--vermilion)" font-weight="700"' : ''}>${esc(lab)}</text>`;
  });
  return svg + '</svg>';
}

function donut({ items, total, centerLabel = 'TOTAL', centerValue = '', thickness = 22, size = 190 }) {
  const r = (size / 2) - thickness / 2 - 2, c = 2 * Math.PI * r;
  const t = total || items.reduce((a, i) => a + Number(i.value || 0), 0) || 1;
  let offset = 0;
  const arcs = items.filter(i => Number(i.value) > 0).map(i => {
    const frac = Number(i.value) / t;
    const dash = frac * c;
    const seg = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${i.color}" stroke-width="${thickness}"
      stroke-dasharray="${dash.toFixed(2)} ${(c - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      stroke-linecap="butt" data-tip="${esc(i.label + '\n' + money(i.value) + ' · ' + Math.round(frac * 100) + '%')}"
      style="animation:fadeIn .5s var(--ease) both"/>`;
    offset += dash;
    return seg;
  }).join('');
  return `<div class="donut-wrap" style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
    <div style="position:relative;width:${size}px;height:${size}px;flex:none">
      <svg viewBox="0 0 ${size} ${size}" style="width:100%;height:100%;transform:rotate(-90deg)" role="img" aria-label="Distribuição">
        <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="${thickness}"/>
        ${arcs}
      </svg>
      <div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none">
        <div class="eyebrow" style="font-size:9px">${esc(centerLabel)}</div>
        <div style="font-family:var(--serif);font-size:20px;letter-spacing:-.02em;margin-top:3px">${esc(centerValue)}</div>
      </div>
    </div>
    <div style="flex:1;min-width:170px;display:flex;flex-direction:column;gap:2px">
      ${items.map(i => `<div class="row" style="padding:7px 0">
        <i style="width:9px;height:9px;border-radius:3px;background:${i.color};flex:none"></i>
        <span style="font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.label)}</span>
        <span class="tail num" style="font-size:12.5px">${money(i.value)}</span>
      </div>`).join('')}
    </div></div>`;
}

function ringSVG(percent, { size = 118, label = '', value = '' } = {}) {
  const r = size / 2 - 7, c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(100, percent));
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}">
      <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="var(--indigo)"/><stop offset="55%" stop-color="var(--vermilion)"/><stop offset="100%" stop-color="var(--danger)"/>
      </linearGradient></defs>
      <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}"/>
      <circle class="prog" cx="${size / 2}" cy="${size / 2}" r="${r}"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c - (c * p) / 100).toFixed(1)}" data-ring="${p}"/>
    </svg>
    <div class="ring-label"><b>${esc(value)}</b><small>${esc(label)}</small></div>
  </div>`;
}

/* topbar do celular: esconde ao descer, volta ao subir um pouco */
function topbarInit() {
  const bar = document.querySelector('.topbar');
  if (!bar) return;
  /* Direção acumulada, não salto por evento: rolagem lenta com o dedo
     gera eventos de 1–3 px e precisa disparar do mesmo jeito. */
  const DOWN_AT = 22;   /* descendo este tanto (acumulado) → esconde  */
  const UP_AT = 34;     /* subindo este tanto (acumulado) → mostra     */
  let last = window.scrollY, dirAcc = 0, ticking = false;
  const mobile = () => window.innerWidth <= 900;
  const apply = () => {
    ticking = false;
    const y = window.scrollY;
    const delta = y - last;
    last = y;
    if (!mobile() || prefs.hideTopbar === false) {
      bar.classList.remove('is-tucked', 'is-scrolled');
      dirAcc = 0;
      return;
    }
    bar.classList.toggle('is-scrolled', y > 6);
    /* A barra só reaparece no topo absoluto: qualquer rolagem para baixo,
       a partir daí, esconde de novo. Assim, no meio da página ela nunca
       volta a ocupar a tela enquanto se rola para cima. */
    if (y <= 8) {
      bar.classList.remove('is-tucked');
      dirAcc = 0;
      return;
    }
    if (bar.classList.contains('is-tucked')) return;   /* já escondida: fica escondida */
    /* trocou de sentido? zera o acumulador para não misturar os dois */
    if ((delta > 0 && dirAcc < 0) || (delta < 0 && dirAcc > 0)) dirAcc = 0;
    dirAcc += delta;
    if (dirAcc >= DOWN_AT) {        /* desceu o bastante → some */
      bar.classList.add('is-tucked');
      dirAcc = 0;
    }
  };
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(apply); } }, { passive: true });
  window.addEventListener('resize', () => { if (!mobile()) bar.classList.remove('is-tucked', 'is-scrolled'); }, { passive: true });
  /* altura real da barra → usada para não cobrir a marca com o botão flutuante */
  const publishH = () => {
    bar.classList.remove('is-tucked');
    const h = Math.round(bar.getBoundingClientRect().height);
    if (h > 0) document.documentElement.style.setProperty('--topbar-h', h + 'px');
  };
  publishH();
  window.addEventListener('resize', publishH, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(publishH, 200), { passive: true });
}

   ============================================================ */
/* sequência de dias com tatame ativo (ignora dias sem treino) */
function dojoStreak() {
  const trainingDay = d => Object.values(GROUPS).some(g => g.days.includes(parseD(d).getDay()));
  let n = 0, d = TODAY_ISO;
  if (!attendanceOf(d).length) d = addDays(d, -1);
  for (let i = 0; i < 180; i++) {
    if (trainingDay(d)) {
      if (!attendanceOf(d).length) break;
      n++;
    }
    d = addDays(d, -1);
  }
  return n;
}

/* ============================================================
   LEMBRETE DE VENCIMENTO NO WHATSAPP
   - fila calculada a partir das mensalidades em aberto
   - link wa.me com mensagem pronta (envio assistido)
   - registro do que já foi avisado (1x por dia por aluno)
   ============================================================ */
const WA_PIX_DEFAULT = 'dojoarandu@gmail.com';
/* bloco de fechamento — entra em TODA mensagem, inclusive na de vencimento */
const WA_CLOSING = ['Nosso pix:', '{pix}', '', 'Ficamos no aguardo do comprovante para confirmar seu pagamento! {emoji}', '', 'Qualquer coisa me chama. Oss!'];
/* emojis disponíveis (o token {emoji} entra no fechamento) */
const WA_EMOJIS = ['✅', '✓', '✔', '☑', '🙏', '😊', '🥋', '💪', '👍', '🙌', '👊', ''];
const WA_TEMPLATE_DEFAULT = [
  'Olá, {saudacao}! {intro}',
  '',
  '{resumo}',
  '',
  ...WA_CLOSING
].join('\n');

/* modelo salvo nas versões antigas (v2.13) — sem resumo e sem o bloco do Pix */
function waLegacyTemplate(t) {
  if (!t) return false;
  return !/\{resumo\}/.test(t) && !/Nosso pix/i.test(t) && /\{mes\}/.test(t);
}
/* todo modelo termina com o bloco do Pix + comprovante + "Oss!" */
function waWithClosing(tpl) {
  const t = String(tpl || '').trim() || WA_TEMPLATE_DEFAULT;
  if (/Nosso pix/i.test(t) || /\{pix\}/.test(t)) return t; /* já tem o fechamento */
  return t + '\n\n' + WA_CLOSING.join('\n');
}

/* o aparelho sabe desenhar este caractere? (evita enviar ▯ no lugar do emoji) */
let _glyphCtx = null;
function glyphRenders(ch) {
  if (!ch) return true;
  try {
    if (!_glyphCtx) {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      _glyphCtx = c.getContext('2d', { willReadFrequently: true });
    }
    const x = _glyphCtx;
    const draw = t => { x.clearRect(0, 0, 64, 64); x.font = '48px sans-serif'; x.textBaseline = 'top'; x.fillStyle = '#000'; x.fillText(t, 2, 2); return x.getImageData(0, 0, 64, 64).data; };
    const ref = draw('\uFFFF'); /* glifo inexistente = caixa vazia (tofu) */
    const d = draw(ch);
    let same = 0;
    for (let i = 0; i < d.length; i += 4) if (Math.abs(d[i] - ref[i]) < 8 && Math.abs(d[i + 3] - ref[i + 3]) < 8) same += 1;
    return same < 64 * 64 * 0.9;
  } catch (e) { return true; }
}

function onlyDigits(v) { return String(v || '').replace(/\D/g, ''); }
/* telefone brasileiro → formato do wa.me: 55 + DDD + número */
function waNumber(phone) {
  let d = onlyDigits(phone);
  if (!d) return '';
  if (d.length <= 11 && !d.startsWith('55')) d = '55' + d;
  if (d.length === 13 && d.startsWith('55')) return d;
  if (d.length === 12) return d;
  return d.length >= 12 ? d : '';
}
const waConfigured = () => !!(prefs.waNumber && onlyDigits(prefs.waNumber).length >= 10);

/* mensalidades em aberto do aluno, da mais antiga para a mais nova */
function waOpenMonths(studentId) {
  return db.payments
    .filter(p => p.studentId === studentId && p.status !== 'Pago')
    .sort((a, b) => (a.month || '').localeCompare(b.month || ''));
}
/* valor curto: R$ 70 (sem ,00 quando inteiro) */
const waMoney = v => {
  const n = Number(v) || 0;
  return 'R$ ' + (Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.', ','));
};
const waMonthLabel = m => {
  const [y, mm] = (m || MONTH).split('-');
  return `${MONTHS[Number(mm) - 1].toLowerCase()} de ${y}`;
};
const waMonthShort = m => {
  const [y, mm] = (m || MONTH).split('-');
  return `${MONTHS[Number(mm) - 1].toLowerCase()}/${y.slice(2)}`;
};

/* frases que se adaptam ao que está realmente em aberto */
function waIntro(s, open) {
  if (!open.length) return 'Sua mensalidade está em dia — passando só para relembrar o Pix e o comprovante.';
  /* mês do aviso: o que vence hoje; se não houver, o mais recente em aberto */
  const ref = open.find(p => p.dueDate === TODAY_ISO) || open[open.length - 1];
  const dd = Number(String(ref.dueDate || '').slice(8, 10)) || Number(s.dueDay) || 10;
  const when = ref.dueDate === TODAY_ISO ? `vence hoje (dia ${dd})`
    : isLatePayment(ref) ? `venceu em ${dateShort(ref.dueDate)} (dia ${dd}) e segue em aberto`
      : `vence em ${dateShort(ref.dueDate)} (dia ${dd})`;
  /* mês por extenso ("novembro"); o ano entra só se não for o ano corrente */
  const [anoAtual] = TODAY_ISO.split('-');
  const [anoRef] = (ref.month || MONTH).split('-');
  const mesNome = MONTHS[Number((ref.month || MONTH).split('-')[1]) - 1].toLowerCase();
  const mesTxt = `${mesNome}${anoRef === anoAtual ? '' : ' de ' + anoRef}`;
  /* além do mês citado, há outras mensalidades em aberto? */
  const extra = open.length > 1 ? ' e identificamos outras pendências' : '';
  return `Passando para lembrar que sua mensalidade de ${mesTxt} ${when}${extra}. Este é o resumo:`;
}

/* lista apenas os meses em aberto (+ total quando há mais de um) */
function waResumo(s, open) {
  if (!open.length) return '';
  const list = open.slice().sort((a, b) => (a.month || '').localeCompare(b.month || ''));
  const lines = list.map(p => `${waMonthShort(p.month)} = ${waMoney(p.amount)}`);
  const total = open.reduce((a, p) => a + (Number(p.amount) || 0), 0);
  if (open.length > 1) lines.push(`Total = ${waMoney(total)}`);
  return lines.join('\n');
}

function waFillTemplate(tpl, s, p) {
  /* p pode vir indefinido (aluno sem lançamento) — usa o que estiver em aberto */
  p = p || waOpenMonths(s.id)[0] || { month: MONTH, dueDate: dueFor(s, MONTH), amount: s.fee || 0 };
  const d = parseD(p.dueDate || TODAY_ISO);
  const open = waOpenMonths(s.id);
  /* se o registro clicado não está em aberto (ex.: já pago), o resumo fala do que está */
  const list = open.length ? open : [];
  const total = list.reduce((a, x) => a + (Number(x.amount) || 0), 0);
  const menor = Number(s.age) > 0 && Number(s.age) < 18;
  const saudacao = menor
    ? ((s.guardian || '').trim() ? `${s.guardian.trim()} (responsável por ${(s.name || '').split(' ')[0]})` : `responsável por ${(s.name || '').split(' ')[0]}`)
    : (s.name || '').split(' ')[0];
  const tplUse = waWithClosing(tpl);
  let msg = tplUse
    .replaceAll('{intro}', waIntro(s, list))
    .replaceAll('{saudacao}', saudacao)
    .replaceAll('{nome}', (s.name || '').split(' ')[0])
    .replaceAll('{nomeCompleto}', s.name || '')
    .replaceAll('{mes}', list.length ? waMonthLabel(list[0].month) : waMonthLabel(p.month || MONTH))
    .replaceAll('{valor}', waMoney(list.length ? total : (p.amount || s.fee || 0)))
    .replaceAll('{dia}', String(Number(s.dueDay) || d.getDate()))
    .replaceAll('{resumo}', waResumo(s, list))
    .replaceAll('{pix}', prefs.waPix || WA_PIX_DEFAULT)
    .replaceAll('{dojo}', 'Arandu')
    .replaceAll('{emoji}', prefs.waEmoji ?? WA_EMOJI_DEFAULT);
  /* limpa blocos vazios (sem meses em aberto → sem a lista) */
  msg = msg.replace(/\n{3,}/g, '\n\n').replace(/[ \t]+$/gm, '').trim();
  return msg;
}

/* fila do dia: quem vence hoje (e opcionalmente em atraso) */
function waQueue(opts = {}) {
  const includeLate = opts.includeLate !== false;
  return db.payments
    .filter(p => p.status !== 'Pago')
    .filter(p => {
      if (p.dueDate === TODAY_ISO) return true;
      return includeLate && isLatePayment(p);
    })
    .map(p => {
      const s = studentById(p.studentId);
      return s && s.status === 'Ativo' ? { p, s, kind: p.dueDate === TODAY_ISO ? 'hoje' : 'atraso' } : null;
    })
    .filter(Boolean)
    .sort((a, b) => (a.p.dueDate || '').localeCompare(b.p.dueDate || ''));
}

/* já avisado hoje? */

function waMarkSent(id, mode) {
  db.waLog ||= [];
  db.waLog = db.waLog.filter(l => !(l.paymentId === id && l.date === TODAY_ISO));
  db.waLog.push({ paymentId: id, date: TODAY_ISO, at: new Date().toISOString(), mode });
  save();
}

/* abre o WhatsApp (app ou web) com a mensagem pronta */
function waSend(paymentId, opts = {}) {
  const p = db.payments.find(x => x.id === paymentId);
  if (!p) { toast('Mensalidade não encontrada.', { icon: 'alert' }); return; }
  const s = studentById(p.studentId);
  if (!s) { toast('Aluno não encontrado.', { icon: 'alert' }); return; }
  const num = waNumber(s.phone);
  if (!num) { toast(`${s.name.split(' ')[0]} está sem telefone válido para o WhatsApp.`, { icon: 'alert' }); return; }
  const msg = waFillTemplate(prefs.waTemplate, s, p);
  const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  if (opts.silent) return url;

  /* 1ª tentativa: aba nova. Se o navegador bloquear pop-up, a aba volta nula
     e a mensagem se perde — então confirmamos antes de registrar o envio. */
  let abriu = null;
  try { abriu = window.open(url, '_blank', 'noopener'); } catch (e) { abriu = null; }
  if (!abriu) {
    showWaFallback(s, p, url, num);
    return url;                       /* NÃO marca como avisado: nada foi enviado */
  }
  waMarkSent(paymentId, waConfigured() ? 'auto' : 'assistido');
  if (!waConfigured()) toast('Abrindo o WhatsApp com a mensagem pronta.', { icon: 'checkCircle' });
  return url;
}

/* varredura do dia: registra o que já saiu automático e agenda o disparo no horário */
let waTimer = null;
function waAutoRun() {
  clearTimeout(waTimer);
  if (!waConfigured()) return;
  const fire = () => {
    const sent = [];
    waQueue({ includeLate: prefs.waLate !== false }).forEach(({ p, s }) => {
      if (waDoneToday(p.id) || !onlyDigits(s.phone)) return;
      waMarkSent(p.id, 'auto');
      sent.push(s.name);
    });
    if (sent.length) {
      render();
      toast(`${sent.length} lembrete${sent.length > 1 ? 's' : ''} de vencimento enviado${sent.length > 1 ? 's' : ''}.`, { icon: 'whatsapp' });
    }
  };
  const [hh, mm] = (prefs.waTime || '09:00').split(':').map(Number);
  const now = new Date();
  const at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
  if (at <= now) fire();                       /* já passou do horário: sai agora */
  else waTimer = setTimeout(() => { fire(); render(); }, at - now);
}

/* estado do treino de hoje: 'antes' | 'durante' | 'encerrado' | 'fora' (dia sem aula) */
function sessionPhase(date = TODAY, g = 'Adulto') {
  const cfg = GROUPS[g];
  const dow = date.getDay();
  const ativo = cfg.days.includes(dow);
  const now = date.getTime() === TODAY.getTime() ? new Date() : null;
  const min = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  if (!ativo) return { fase: 'fora', inicio: cfg.start, fim: cfg.end };
  if (!now) return { fase: 'durante', inicio: cfg.start, fim: cfg.end };
  const atual = now.getHours() * 60 + now.getMinutes();
  const fase = atual < min(cfg.start) ? 'antes' : atual >= min(cfg.end) ? 'encerrado' : 'durante';
  return { fase, inicio: cfg.start, fim: cfg.end, atual };
}

function filteredStudents() {
  const q = view.q.trim().toLowerCase();
  return db.students.filter(s => {
    const f = view.filter;
    let ok = true;
    if (f === 'Ativos') ok = s.status === 'Ativo';
    else if (f === 'Inativos') ok = s.status !== 'Ativo';
    else if (f === 'Adulto' || f === 'Kids') ok = groupOf(s) === f;
    if (!ok) return false;
    if (!q) return true;
    return `${s.name} ${s.phone} ${s.belt} ${s.locality}`.toLowerCase().includes(q);
  });
}
const SORT_GET = {
  name: s => s.name || '', belt: s => beltRank(s.belt), classGroup: s => groupOf(s), locality: s => s.locality || '',
  freqWeek: s => freqCount(s.id, 'week'), freqMonth: s => freqCount(s.id, 'month'), freqYear: s => freqCount(s.id, 'year'),
  fee: s => Number(s.fee) || 0, status: s => s.status || '', age: s => Number(s.age) || 0
};
function sortedStudents() {
  const arr = filteredStudents();
  const { key, dir } = view.sortStudents;
  return arr.sort((a, b) => cmp((SORT_GET[key] || SORT_GET.name)(a), (SORT_GET[key] || SORT_GET.name)(b)) * dir);
}
function studentRowsHTML(mode) {
  const arr = sortedStudents();

    <button data-act="sort-students" data-id="${key}">${label}<span class="arrow">${sk === key ? (view.sortStudents.dir === 1 ? '↑' : '↓') : '↕'}</span></button></th>`;
  if ((mode || view.studentsView) === 'cards') {
    return `<div style="padding:14px">
      ${arr.length ? `<div class="grid-3 student-cards">${arr.map(s => `<button class="card card--paper student-card" style="text-align:left;padding:16px;border-radius:18px" data-act="open-profile" data-id="${s.id}">

        <div style="display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);min-width:0">
          <span class="small dim" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.locality || '—')}</span>
          <span style="margin-left:auto">${freqBars(s)}</span>
        </div>
      </button>`).join('')}</div>`

function pageAlunos() {
  const total = db.students.length, active = activeStudents().length;
  /* no celular a tabela larga força repaint caro: usa a visão em cartões */
  const mobileCards = window.matchMedia && window.matchMedia('(max-width:900px)').matches;
  const viewMode = mobileCards ? 'cards' : view.studentsView;
  const counts = {
    Todos: total, Ativos: active, Inativos: total - active,
    Adulto: db.students.filter(s => groupOf(s) === 'Adulto').length,

function monthlyCalendarHTML(month) {
  const [y, mo] = month.split('-').map(Number);
  const offset = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const n = daysInMonth(month);
  const adultRoster = rosterOf('Adulto'), kidsRoster = rosterOf('Kids');
  const one = (g, date, roster) => {
    if (!roster.length || !sessionOpen(date, g)) return null;
    const k = attendanceOf(date).filter(id => { const s = studentById(id); return s && groupOf(s) === g; }).length;
    return { count: k, pct: Math.round((k / roster.length) * 100) };
  };
  let cells = '<div class="cell cell--empty"></div>'.repeat(offset);
  for (let day = 1; day <= n; day++) {
    const date = `${month}-${pad(day)}`;
    const wd = new Date(y, mo - 1, day).getDay();
    const a = one('Adulto', date, adultRoster), k = one('Kids', date, kidsRoster);
    const future = date > TODAY_ISO;
    const off = !GROUPS.Adulto.days.includes(wd) && !GROUPS.Kids.days.includes(wd);
    const tone = Math.max(a ? a.pct : 0, k ? k.pct : 0);
    const bg = tone ? `background:color-mix(in srgb,var(--vermilion) ${Math.round(5 + tone * 0.33)}%,var(--card));border-color:color-mix(in srgb,var(--vermilion) ${Math.round(12 + tone * 0.3)}%,var(--line))` : '';
    const tip = dateBR(date) + '\n' + (a ? `Adulto: ${a.count} (${a.pct}%)` : 'Adulto: sem treino') + '\n' + (k ? `Kids: ${k.count} (${k.pct}%)` : 'Kids: sem treino');
    cells += `<div class="cell ${date === TODAY_ISO ? 'cell--today' : ''} ${future ? 'cell--future' : ''} ${off ? 'cell--off' : ''}"
      data-clickable="${!future}" ${!future ? `data-act="open-day" data-id="${date}"` : ''}
      data-tip="${esc(tip)}" style="${bg}">
      <span class="dnum">${day}</span>
      <span class="mini">${a ? `<i class="a" style="height:${Math.max(4, Math.round(a.pct * 0.18))}px"></i>` : ''}${k ? `<i class="k" style="height:${Math.max(4, Math.round(k.pct * 0.18))}px"></i>` : ''}</span>
    </div>`;
  }
  return `<div class="heat">
    ${['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map(d => `<div class="dow">${d}</div>`).join('')}
    ${cells}</div>
    <div class="heat-key">
      <span><i class="dot dot--seal" style="width:6px;height:6px;border-radius:2px"></i> adulto</span>
      <span><i class="dot dot--indigo" style="width:6px;height:6px"></i> kids</span>
      <span>intensidade = presença</span>
      <span>clique no dia → chamada</span>
    </div>`;
}
function monthlyChartData(month) {
  const n = daysInMonth(month);
  const adultRoster = rosterOf('Adulto'), kidsRoster = rosterOf('Kids');
  const labels = [], pointLabels = [], adult = [], kids = [], visits = [];
  for (let day = 1; day <= n; day++) {
    const date = `${month}-${pad(day)}`;
    labels.push(String(day));
    pointLabels.push(dateShort(date));
    const future = date > TODAY_ISO;
    const calc = (g, roster) => {
      if (!roster.length || !sessionOpen(date, g) || future) return null;
      const k = attendanceOf(date).filter(id => { const s = studentById(id); return s && groupOf(s) === g; }).length;
      return view.monthMetric === 'percent' ? Math.round((k / roster.length) * 100) : k;
    };
    const a = calc('Adulto', adultRoster), k = calc('Kids', kidsRoster);
    adult.push(a); kids.push(k);
    const vOpen = !future && openGroups(date).length;
    visits.push(vOpen ? dayVisitors(date).filter(v => sessionOpen(date, v.classGroup || 'Adulto')).length : null);
  }
  return { labels, pointLabels, adult, kids, visits, maxAdult: adultRoster.length, maxKids: kidsRoster.length };
}
